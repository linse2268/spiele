<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spielstube</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Schriften laden nicht-blockierend: Die Seite erscheint sofort, auch wenn Google Fonts langsam oder nicht erreichbar ist -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* ============ STYLES ============ */
:root{
  --bg:#161310; --bg2:#25201b; --line:#4d453b; --ink:#f7f2e8; --dim:#b8ae9d; --accent:#f2b94b; --bad:#e5604d;
  --r:28px; --gap:16px; --pad:clamp(16px,3vw,28px);
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{height:100%;color:var(--ink);font:400 16px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* wiederverwendbare Bausteine */
.btn{min-height:52px;min-width:52px;padding:0 28px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:500 15px var(--mono);border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;touch-action:manipulation}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1308}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--ink);border-color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--dim);padding:0 22px}
.btn.ghost:hover,.btn.ghost:focus-visible{border-color:var(--ink);background:transparent;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:500;line-height:1}
.card{display:grid;grid-template-columns:1fr auto;gap:var(--gap) 24px;align-items:end;padding:32px;border:2px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;background:var(--bg2);transition:border-color .25s,transform .25s var(--ease)}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-3px)}
.card h2{margin:0;font:400 44px/1 var(--display)}
.card p{margin:12px 0 0;color:var(--dim);font-size:15px;max-width:46ch}
.card .meta{text-align:right;color:var(--dim);font-size:14px}
.card .meta .num{display:block;color:var(--accent);font-size:44px;margin-top:8px}

/* Übersicht */
.home{padding:clamp(24px,6vw,72px);overflow:auto}
.home h1{margin:0 0 12px;font:400 clamp(56px,11vw,128px)/.9 var(--display);letter-spacing:-.02em}
.home .lead{margin:0 0 clamp(32px,6vw,64px);color:var(--dim);max-width:44ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:var(--gap)}

/* Spielgerüst */
.bar{display:flex;align-items:center;gap:var(--gap);padding:var(--gap) var(--pad)}
.bar h2{margin:0;font:400 32px/1 var(--display);flex:1}
.bar .best{color:var(--dim);font-size:14px;display:flex;gap:12px;align-items:baseline}
.bar .best .num{color:var(--accent);font-size:26px}
.stage{flex:1;min-height:0;display:flex;gap:var(--gap);padding:0 var(--pad) var(--pad)}

/* Color Picker */
.sliders{display:flex;gap:12px;flex:none}
.sl{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(56px,7vw,76px)}
.sl .track{position:relative;flex:1;width:100%;min-height:0;border-radius:999px;box-shadow:0 0 0 2px var(--line);touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.sl .thumb{position:absolute;left:50%;width:44px;height:44px;transform:translateX(-50%);border-radius:50%;border:4px solid var(--ink);background:var(--ink);box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.sl label{color:var(--ink);font-size:14px;font-weight:500;height:20px}
.field{position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.field .layer{position:absolute;inset:0}
.field .corner{position:absolute;top:var(--pad);right:calc(var(--pad) + 4px);font-size:clamp(48px,9vw,120px);transition:color .2s}
.field .tag{position:absolute;bottom:var(--pad)}
.field .actions{position:absolute;right:var(--pad);bottom:var(--pad);display:flex;gap:12px;align-items:center}
.field .note{color:var(--accent);animation:enter .4s var(--ease)}
.field .actions .btn{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.field .actions .btn:hover,.field .actions .btn:focus-visible{background:var(--accent);border-color:var(--accent);color:#1a1308}
.compare .mine{clip-path:inset(0 0 0 100%);transition:clip-path .9s var(--ease) .15s}
.compare.go .mine{clip-path:inset(0 0 0 50%)}

/* Blockfolge: Levelauswahl */
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--gap);align-content:center;overflow:auto}
.lvl{display:flex;flex-direction:column;gap:8px;text-align:left;padding:clamp(16px,2vw,28px);border:2px solid var(--line);border-radius:var(--r);background:var(--bg2);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .25s,transform .25s var(--ease);touch-action:manipulation}
.lvl:hover,.lvl:focus-visible{border-color:var(--accent);transform:translateY(-3px)}
.lvl .size{font-size:clamp(34px,5vw,64px);color:var(--accent)}
.lvl .name{font:400 clamp(26px,3vw,38px)/1 var(--display);margin-top:8px}
.lvl .rec{color:var(--dim);font-size:14px;margin-top:8px}
.lvl .rec .num{color:var(--ink);margin-left:8px;font-size:18px}

/* Blockfolge: Spiel */
.seq{align-items:stretch}
.side{display:flex;flex-direction:column;justify-content:center;gap:var(--gap);width:clamp(180px,24vw,280px);flex:none}
.side .big{font-size:clamp(64px,12vw,140px);color:var(--accent)}
.side .lbl{color:var(--dim);font-size:14px;margin-top:-8px}
.side .status{margin:0;font-size:16px;min-height:48px}
.side .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:52px}
.side .actions .note{color:var(--accent);background:var(--bg2)}
.board-wrap{flex:1;min-width:0;min-height:0;container-type:size;display:grid;place-items:center}
.board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;gap:clamp(6px,1.4cqmin,16px)}
.cell{border:2px solid var(--line);background:var(--bg2);border-radius:clamp(10px,2.6cqmin,24px);padding:0;min-width:0;min-height:0;cursor:pointer;transition:background .12s,border-color .12s,transform .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cell:focus{outline:none}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.board.locked .cell{cursor:default}
.board:not(.locked) .cell:hover{border-color:var(--dim)}
.cell.lit{background:var(--accent);border-color:var(--accent);transform:scale(.94)}
.cell.wrong{background:var(--bad);border-color:var(--bad)}
.cell.hint{border-color:var(--ink)}

@media (max-height:480px){
  .bar{padding-top:8px;padding-bottom:8px}.bar h2{font-size:24px}.btn{min-height:44px}
  .sl{gap:6px}.sl label{height:16px}.sl .thumb{width:40px;height:40px}.home{padding:20px}.home h1{font-size:48px}
  .side .big{font-size:56px}.side{gap:8px}
  .lvl{padding:12px}.lvl .size{font-size:32px}.lvl .name{font-size:24px;margin-top:0}
}
@media (orientation:portrait){
  .seq{flex-direction:column}
  .side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .side .big{font-size:56px}.side .lbl{display:none}.side .status{flex:1;min-height:0}
  .levels{grid-template-columns:repeat(2,1fr);align-content:start}
}
@media (max-width:560px) and (orientation:portrait){.card{grid-template-columns:1fr}.card .meta{text-align:left}}
/* Reaktionstest */
.react .pad{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--bg2);transition:background .15s}
.react .pad:focus{outline:none}
.react .pad:focus-visible{outline:3px solid var(--accent);outline-offset:-6px}
.react.go .pad{background:var(--accent)}
.react.early .pad{background:var(--bad)}
.react.go .msg,.react.go .corner,.react.early .msg,.react.early .corner{color:#1a1308}
.msg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:var(--pad);pointer-events:none}
.msg .main{font:400 clamp(40px,8vw,96px)/1 var(--display)}
.msg .main.num{font-size:clamp(64px,14vw,160px)}
.msg .sub{font-size:15px;opacity:.85}
.react .corner,.react .tag{pointer-events:none}
.react .tag{left:var(--pad)}
.react .actions{z-index:2}
@media (max-height:480px){.msg .main{font-size:44px}.msg .main.num{font-size:72px}.msg{gap:4px}}
/* Schätzspiel */
.est .fig{display:grid;place-items:center;padding:clamp(72px,12vw,120px) var(--pad)}
.est svg{width:100%;height:100%;overflow:visible}
.est .ray,.est .ln{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;fill:none}
.est .ln.ref{stroke:var(--accent)}
.est .dot{fill:var(--ink)}
.est .pie-bg{fill:var(--bg)}
.est .pie{fill:var(--accent)}
.est .rim{fill:none;stroke:var(--line);stroke-width:.8}
.est .svgtxt{fill:var(--dim);font:500 5px var(--mono)}
.est .tag{position:absolute;max-width:58%;white-space:normal;line-height:1.3;border-radius:20px}
.est .tag.top{top:var(--pad);bottom:auto;left:var(--pad)}
.est .tags{position:absolute;left:var(--pad);bottom:var(--pad);display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 190px)}
.est .chip.key{color:var(--accent)}
@media (max-height:480px){.est .fig{padding:56px var(--pad) 64px}.est .tag.top{max-width:50%}}
/* Stroop-Test */
.stroop .layer{transition:box-shadow .15s}
.stroop.ok .layer{box-shadow:inset 0 0 0 5px var(--accent)}
.stroop.bad .layer{box-shadow:inset 0 0 0 5px var(--bad)}
.stroop .stim{position:absolute;inset:0 0 calc(var(--pad) + 96px) 0;display:grid;place-items:center;font:400 clamp(72px,16vw,200px)/1 var(--display);pointer-events:none}
.stroop .opts{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stroop .opts .btn{min-height:76px;padding:0 6px;font-size:16px}
.stroop .tag{top:var(--pad);left:var(--pad);bottom:auto}
.stroop.idle .stim,.stroop.idle .opts,.stroop.idle .tag,.stroop.idle .corner,
.stroop.done .stim,.stroop.done .opts{display:none}
.stroop.play .msg,.stroop.play .actions{display:none}
@media (max-height:480px){
  .stroop .stim{inset:0 0 calc(var(--pad) + 68px) 0;font-size:80px}
  .stroop .opts .btn{min-height:56px}
}
/* Mastermind */
.mm{--u:clamp(26px,calc((100dvh - 150px) / 10),44px);align-items:center;justify-content:center;gap:clamp(16px,4vw,56px)}
.mboard{display:flex;flex-direction:column;gap:4px;flex:none}
.mrow{height:var(--u);display:flex;align-items:center;gap:calc(var(--u) * .3);padding:0 calc(var(--u) * .35);border-radius:999px;background:var(--bg2);box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.mrow.cur{box-shadow:0 0 0 2px var(--accent)}
.mpegs{display:flex;gap:calc(var(--u) * .14)}
.mp{width:calc(var(--u) * .62);height:calc(var(--u) * .62);border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.mp.f{box-shadow:none}
.mpins{display:grid;grid-template-columns:repeat(2,calc(var(--u) * .22));gap:calc(var(--u) * .08)}
.mpin{width:calc(var(--u) * .22);height:calc(var(--u) * .22);border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
.mpin.x{background:var(--ink);box-shadow:none}
.mpin.c{box-shadow:inset 0 0 0 2px var(--ink)}
.mside{display:flex;flex-direction:column;justify-content:center;gap:12px;width:clamp(250px,36vw,380px);flex:none}
.mstatus{margin:0;font-size:15px;min-height:46px}
.slots{display:flex;gap:12px}
.slot{width:56px;height:56px;padding:0;border-radius:50%;background:var(--bg2);border:2px dashed var(--line);cursor:pointer;touch-action:manipulation;transition:border-color .2s}
.slot.f{border:2px solid var(--ink)}
.slot:hover{border-color:var(--ink)}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
.sw{width:100%;max-width:58px;aspect-ratio:1;min-height:46px;padding:0;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line);transition:box-shadow .2s,transform .15s}
.sw:hover,.sw:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw:active{transform:scale(.92)}
.macts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:52px}
.macts .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.macts .note{color:var(--accent);background:var(--bg2)}
.legend{margin:0;color:var(--dim);font-size:13px}
.mside.over .palette,.mside.over .legend{display:none}
.mside.over .slot{pointer-events:none;border-style:solid;border-color:var(--ink)}
@media (orientation:portrait){
  .mm{--u:clamp(22px,calc((100dvh - 430px) / 10),40px);flex-direction:column;gap:12px}
  .mside{width:100%;gap:10px}
  .mstatus{min-height:0}
  .palette{grid-template-columns:repeat(6,1fr);gap:8px}
}
@media (max-height:480px){
  .mside{width:clamp(240px,40vw,340px);gap:8px}
  .slot{width:48px;height:48px}
  .palette{gap:8px}
  .sw{max-width:46px}
  .mstatus{font-size:14px;min-height:0}
  .macts{min-height:44px}
  .legend{font-size:12px}
}
/* Kopfzeile: Zurück-Button schrumpft nie, lange Titel kürzen sich statt zu überlaufen */
.bar .btn{flex:none}
.bar h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  .bar{gap:10px}.bar h2{font-size:24px}.bar .btn.ghost{padding:0 14px}
  .bar .best{font-size:12px;gap:8px}.bar .best .num{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ SCORE-MODUL ============
   Ein localStorage-Key, ein Objekt pro Spiel-ID: { "color-picker": { best: 87 } }
   Fallback auf Arbeitsspeicher, falls der Speicher nicht verfügbar ist. */
const Score = (() => {
  const KEY = 'spielstube.scores';
  let mem = {};
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || mem; } catch (e) { return mem; } };
  const save = d => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  return {
    getBest: id => { const e = load()[id]; return e && typeof e.best === 'number' ? e.best : 0; },
    /* gibt true zurück, wenn ein neuer Bestwert erreicht wurde */
    submitScore(id, s) {
      const d = load(); const prev = d[id] && d[id].best;
      if (typeof prev === 'number' && s <= prev) return false;
      d[id] = { best: s }; save(d); return prev !== undefined || s > 0;
    }
  };
})();

/* ============ HILFSFUNKTIONEN ============ */
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const hsl = (H, S, L) => `hsl(${H} ${S}% ${L}%)`;
const rnd = (a, b) => Math.round(a + Math.random() * (b - a));
function hslToRgb(H, S, L) {
  S /= 100; L /= 100; const k = n => (n + H / 30) % 12, a = S * Math.min(L, 1 - L);
  const f = n => L - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0), f(8), f(4)];
}
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
function toLab([r, g, b]) {
  r = lin(r); g = lin(g); b = lin(b);
  const X = (r * .4124 + g * .3576 + b * .1805) / .95047, Y = r * .2126 + g * .7152 + b * .0722, Z = (r * .0193 + g * .1192 + b * .9505) / 1.08883;
  const f = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
/* CIEDE2000 (CIELAB-Farbabstand, wahrnehmungsgleichmäßig): gewichtet Helligkeit, Buntheit und Farbton
   so, wie das Auge sie unterscheidet. ΔE00 ≈ 1 ist kaum sichtbar, ≈ 2 bei genauem Hinsehen, ≈ 5 klar sichtbar. */
function ciede2000([L1, a1, b1], [L2, a2, b2]) {
  const rad = Math.PI / 180, deg = 180 / Math.PI, p7 = Math.pow(25, 7);
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cb7 = Math.pow((C1 + C2) / 2, 7);
  const G = .5 * (1 - Math.sqrt(Cb7 / (Cb7 + p7)));
  const a1p = (1 + G) * a1, a2p = (1 + G) * a2, C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h1p = C1p === 0 ? 0 : (Math.atan2(b1, a1p) * deg + 360) % 360, h2p = C2p === 0 ? 0 : (Math.atan2(b2, a2p) * deg + 360) % 360;
  const dL = L2 - L1, dC = C2p - C1p; let dh = 0;
  if (C1p * C2p !== 0) { dh = h2p - h1p; if (dh > 180) dh -= 360; else if (dh < -180) dh += 360; }
  const dH = 2 * Math.sqrt(C1p * C2p) * Math.sin(dh * rad / 2);
  const Lb = (L1 + L2) / 2, Cb = (C1p + C2p) / 2; let hb = h1p + h2p;
  if (C1p * C2p !== 0) { if (Math.abs(h1p - h2p) > 180) hb += hb < 360 ? 360 : -360; hb /= 2; }
  const T = 1 - .17 * Math.cos((hb - 30) * rad) + .24 * Math.cos(2 * hb * rad) + .32 * Math.cos((3 * hb + 6) * rad) - .2 * Math.cos((4 * hb - 63) * rad);
  const dTh = 30 * Math.exp(-Math.pow((hb - 275) / 25, 2)), Rc = 2 * Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + p7));
  const Sl = 1 + .015 * Math.pow(Lb - 50, 2) / Math.sqrt(20 + Math.pow(Lb - 50, 2)), Sc = 1 + .045 * Cb, Sh = 1 + .015 * Cb * T;
  const Rt = -Math.sin(2 * dTh * rad) * Rc, x = dL / Sl, y = dC / Sc, z = dH / Sh;
  return Math.sqrt(x * x + y * y + z * z + Rt * y * z);
}
const deltaE = (a, b) => ciede2000(toLab(hslToRgb(...a)), toLab(hslToRgb(...b)));
/* Score: 100 * e^(-(ΔE00/16)^1.75). Kaum sichtbare Abweichungen bleiben bei fast 100, grobe fallen deutlich.
   ΔE00 1 ≈ 99, 2 ≈ 97, 5 ≈ 88, 10 ≈ 65, 20 ≈ 24, 30 ≈ 5 */
const scoreFromDelta = d => Math.round(100 * Math.exp(-Math.pow(d / 16, 1.75)));
/* Schriftfarbe mit bestem Kontrast, nach echter Leuchtdichte der Farbe (hsl-Array) */
const inkOn = c => { const [r, g, b] = hslToRgb(...c).map(lin); return (.2126 * r + .7152 * g + .0722 * b) > .18 ? '#14110d' : '#f7f2e8'; };

/* Gemeinsame Kopfzeile für Spiele: Zurück, Titel, Bestwert.
   idOrGetter: Score-ID (String) oder Funktion, die den anzuzeigenden Bestwert liefert.
   refreshBest() liest den Wert neu und aktualisiert die Anzeige. */
function gameBar(title, idOrGetter, api) {
  const read = typeof idOrGetter === 'function' ? idOrGetter : () => Score.getBest(idOrGetter);
  const bar = h('div', 'bar'), back = h('button', 'btn ghost', 'Zurück'), best = h('div', 'best');
  back.onclick = api.back; best.append(h('span', null, 'Bestwert'));
  const bestNum = h('span', 'num', String(read())); best.append(bestNum);
  bar.append(back, h('h2', null, title), best);
  return { bar, refreshBest: () => bestNum.textContent = String(read()) };
}

/* Gemeinsamer Baustein: vertikaler Slider (unten = 0), per Touch, Maus und Tastatur bedienbar.
   Der Griff bleibt komplett innerhalb der Schiene. Gibt { el, track, thumb, set(wert, feuern?), get() } zurück. */
function slider(label, aria, max, onInput) {
  const sl = h('div', 'sl'), tr = h('div', 'track'), th = h('div', 'thumb'), lb = h('label', null, label);
  tr.append(th); sl.append(tr, lb);
  tr.tabIndex = 0; tr.setAttribute('role', 'slider'); tr.setAttribute('aria-label', aria); tr.setAttribute('aria-orientation', 'vertical');
  tr.setAttribute('aria-valuemin', 0); tr.setAttribute('aria-valuemax', max);
  let v = 0;
  const set = (x, fire) => {
    v = Math.max(0, Math.min(max, x));
    th.style.bottom = `calc((100% - ${th.offsetHeight || 44}px) * ${v / max})`;
    tr.setAttribute('aria-valuenow', Math.round(v)); if (fire) onInput(v);
  };
  const fromY = e => {
    const r = tr.getBoundingClientRect(), T = th.offsetHeight || 44;
    set(Math.max(0, Math.min(1, (r.bottom - e.clientY - T / 2) / (r.height - T))) * max, true);
  };
  tr.addEventListener('pointerdown', e => { tr.setPointerCapture(e.pointerId); fromY(e); });
  tr.addEventListener('pointermove', e => { if (tr.hasPointerCapture(e.pointerId)) fromY(e); });
  tr.addEventListener('keydown', e => {
    const st = max / 100 * (e.shiftKey ? 10 : 1), d = { ArrowUp: st, ArrowRight: st, ArrowDown: -st, ArrowLeft: -st }[e.key];
    if (d) { e.preventDefault(); set(v + d, true); }
  });
  return { el: sl, track: tr, thumb: th, set, get: () => v };
}

/* ============ SPIEL-REGISTRY ============
   NEUES SPIEL HINZUFÜGEN:
   Hänge unten im Array EIN Objekt an:
   { id:'mein-spiel', title:'…', description:'…', players:1,   // 2 = Zwei-Spieler-Spiel
     init(container, api){ … },   // baut das Spiel in container auf
     destroy(){ … },              // optional: Timer/Listener aufräumen
     getBest(){ … },              // optional: eigener Bestwert für die Karte (z. B. bei mehreren Levels)
     bestLabel:'…' }              // optional: Beschriftung des Bestwerts auf der Karte
   api = { Score, h, back() }. Nutze Score.getBest(id) und Score.submitScore(id, punkte).
   Karte, Route (#mein-spiel) und Highscore erscheinen automatisch. */
const GAMES = [];

/* ---------- Spiel 1: Color Picker ---------- */
GAMES.push((() => {
  const ID = 'color-picker'; let timers = [], raf = 0, cleanups = [];
  const clear = () => { timers.forEach(clearInterval); timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); cleanups.forEach(f => f()); cleanups = []; };

  return {
    id: ID, title: 'Color Picker', players: 1,
    description: 'Merke dir eine Farbe und mische sie danach aus dem Gedächtnis nach.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Color Picker', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      function round() {
        clear(); stage.replaceChildren();
        /* faire Zufallsfarbe: kräftig, mittlere Helligkeit */
        const target = [rnd(0, 359), rnd(45, 90), rnd(30, 68)];
        const field = h('div', 'field'), layer = h('div', 'layer'), corner = h('div', 'corner num', '5');
        layer.style.background = hsl(...target); corner.style.color = inkOn(target);
        field.append(layer, corner); stage.append(field);

        const end = Date.now() + 5000; let shown = 5;
        const iv = setInterval(() => {
          const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
          if (left !== shown) { shown = left; corner.textContent = String(left); }
          if (Date.now() >= end) { clearInterval(iv); timers.push(setTimeout(mix, 300)); }
        }, 100); timers.push(iv);

        function mix() {
          stage.replaceChildren();
          const cur = [180, 50, 50];
          const mine = h('div', 'layer'), f = h('div', 'field'), sub = h('div', 'actions'), go = h('button', 'btn primary', 'Abschicken');
          sub.append(go); f.append(mine, sub);
          const paint = () => {
            mine.style.background = hsl(...cur);
            sH.track.style.background = 'linear-gradient(to top,' + [0, 60, 120, 180, 240, 300, 360].map(x => hsl(x, 100, 50)).join(',') + ')';
            sS.track.style.background = `linear-gradient(to top,${hsl(cur[0], 0, cur[2])},${hsl(cur[0], 100, cur[2])})`;
            sL.track.style.background = `linear-gradient(to top,#000,${hsl(cur[0], cur[1], 50)},#fff)`;
            [sH, sS, sL].forEach(s => s.thumb.style.background = hsl(...cur)); /* Griff zeigt die aktuelle Farbe */
          };
          const sH = slider('H', 'Farbton', 360, v => { cur[0] = Math.round(v); paint(); });
          const sS = slider('S', 'Sättigung', 100, v => { cur[1] = Math.round(v); paint(); });
          const sL = slider('L', 'Helligkeit', 100, v => { cur[2] = Math.round(v); paint(); });
          const sw = h('div', 'sliders'); sw.append(sH.el, sS.el, sL.el);
          stage.append(sw, f);
          sH.set(cur[0]); sS.set(cur[1]); sL.set(cur[2]); paint(); /* nach dem Einfügen, damit die Größen bekannt sind */
          go.onclick = () => result(cur.slice());
        }

        function result(mine) {
          stage.replaceChildren();
          const final = scoreFromDelta(deltaE(target, mine));
          const f = h('div', 'field compare'), a = h('div', 'layer'), m = h('div', 'layer mine'), sc = h('div', 'corner num', '0');
          a.style.background = hsl(...target); m.style.background = hsl(...mine); sc.style.color = inkOn(mine);
          const t1 = h('div', 'tag chip', 'Original'), t2 = h('div', 'tag chip', 'Deine Farbe');
          t1.style.left = 'var(--pad)'; t2.style.left = 'calc(50% + var(--pad))';
          const act = h('div', 'actions'); f.append(a, m, t1, t2, sc, act); stage.append(f);
          requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('go')));
          const t0 = performance.now(), D = 3000;
          const step = now => {
            const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
            sc.textContent = String(Math.round(final * e));
            if (p < 1) raf = requestAnimationFrame(step); else finish();
          };
          raf = requestAnimationFrame(step);
          function finish() {
            const isNew = final > 0 && final > Score.getBest(ID); Score.submitScore(ID, final); refreshBest();
            if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
            const again = h('button', 'btn', 'Nochmal'); again.onclick = round; act.append(again); again.focus({ preventScroll: true });
          }
        }
      }
      round();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 2: Blockfolge ----------
   Levelauswahl (2x2 bis 6x6), danach leuchtet eine Folge auf und der Spieler tippt sie nach.
   Richtig = ein Block kommt dazu. Falsch = Ende. Score = Länge der zuletzt geschafften Folge.
   Jedes Level hat einen eigenen Bestwert (Score-ID "block-sequence-4" usw.). */
GAMES.push((() => {
  const ID = 'block-sequence', START = 3;
  const LEVELS = [{ n: 2, name: 'Mini' }, { n: 3, name: 'Sehr leicht' }, { n: 4, name: 'Leicht' }, { n: 5, name: 'Mittel' }, { n: 6, name: 'Schwer' }];
  const MAIN = 4; /* dieses Level liefert den Bestwert für die Startseite */
  const sid = n => ID + '-' + n;
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };

  return {
    id: ID, title: 'Blockfolge', players: 1,
    description: 'Merke dir die aufleuchtenden Blöcke und tippe sie in derselben Reihenfolge nach. Jede Runde kommt einer dazu.',
    getBest: () => Score.getBest(sid(MAIN)), bestLabel: 'Bestwert 4×4', /* Startseite zeigt den Bestwert für 4×4 */
    init(c, api) {
      let level = null;
      const { bar, refreshBest } = gameBar('Blockfolge', () => Score.getBest(sid(level ? level.n : MAIN)), api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      /* ----- Levelauswahl ----- */
      function showLevels() {
        clear(); level = null; refreshBest();
        stage.className = 'stage'; stage.replaceChildren();
        const g = h('div', 'levels');
        LEVELS.forEach(l => {
          const b = h('button', 'lvl'); b.type = 'button';
          const rec = h('div', 'rec', 'Bestwert'); rec.append(h('span', 'num', String(Score.getBest(sid(l.n)))));
          b.append(h('div', 'size num', l.n + '×' + l.n), h('div', 'name', l.name), rec);
          b.onclick = () => { level = l; refreshBest(); play(); };
          g.append(b);
        });
        stage.append(g);
      }

      /* ----- Spiel ----- */
      function play() {
        clear(); const N = level.n, ALL = N * N, SID = sid(N);
        stage.className = 'stage seq'; stage.replaceChildren();

        const side = h('div', 'side'), big = h('div', 'big num', '0'), lbl = h('div', 'lbl', 'Geschafft');
        const status = h('p', 'status'), actions = h('div', 'actions');
        side.append(big, lbl, status, actions);

        const wrap = h('div', 'board-wrap'), board = h('div', 'board locked'), cells = [];
        board.style.gridTemplateColumns = `repeat(${N},1fr)`; board.style.gridTemplateRows = `repeat(${N},1fr)`;
        for (let i = 0; i < ALL; i++) {
          const b = h('button', 'cell'); b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', 'Block ' + (i + 1));
          cells.push(b); board.append(b);
        }
        wrap.append(board); stage.append(side, wrap);

        let seq = [], pos = 0, locked = true, done = 0;
        const lock = v => { locked = v; board.classList.toggle('locked', v); };
        const flash = (n, cls, ms) => { cells[n].classList.add(cls); later(() => cells[n].classList.remove(cls), ms); };
        const unfocus = () => { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); };
        const addBlock = () => { let n; do { n = rnd(0, ALL - 1); } while (seq.length && n === seq[seq.length - 1]); seq.push(n); };

        function start() {
          clear(); actions.replaceChildren(); cells.forEach(x => x.className = 'cell');
          seq = []; done = 0; big.textContent = '0';
          for (let i = 0; i < START; i++) addBlock();
          show();
        }

        /* Folge abspielen; wird mit der Länge etwas schneller */
        function show() {
          unfocus(); lock(true); pos = 0; status.textContent = 'Merke dir die Reihenfolge';
          const on = Math.max(260, 560 - seq.length * 14), gap = Math.max(120, 220 - seq.length * 4);
          let t = 700;
          seq.forEach(n => { later(() => flash(n, 'lit', on), t); t += on + gap; });
          later(() => { unfocus(); lock(false); status.textContent = 'Du bist dran'; }, t);
        }

        function tap(i) {
          if (locked) return;
          if (i !== seq[pos]) return gameOver(i);
          flash(i, 'lit', 180); pos++;
          if (pos === seq.length) {
            lock(true); done = seq.length; big.textContent = String(done); status.textContent = 'Richtig';
            later(() => { addBlock(); show(); }, 800);
          }
        }

        function gameOver(wrong) {
          lock(true); status.textContent = 'Daneben';
          cells[wrong].classList.add('wrong');
          later(() => cells[seq[pos]].classList.add('hint'), 350); /* zeigt, wo es weitergegangen wäre */
          const isNew = done > 0 && done > Score.getBest(SID); Score.submitScore(SID, done); refreshBest();
          actions.replaceChildren();
          if (isNew) actions.append(h('span', 'note chip', 'Neuer Bestwert'));
          const again = h('button', 'btn primary', 'Nochmal'); again.onclick = start;
          const pick = h('button', 'btn', 'Level wählen'); pick.onclick = showLevels;
          actions.append(again, pick); again.focus({ preventScroll: true });
        }

        /* Antippen setzt keinen Fokus auf den Block (verhindert den weißen Fokusrahmen) */
        board.addEventListener('mousedown', e => e.preventDefault());
        board.addEventListener('pointerdown', e => { const b = e.target.closest('.cell'); if (b) { tap(+b.dataset.i); b.blur(); } });
        board.addEventListener('click', e => { const b = e.target.closest('.cell'); if (b && e.detail === 0) tap(+b.dataset.i); }); /* Tastatur */
        start();
      }

      showLevels();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 3: Reaktionstest (reaction) ----------
   5 Versuche: Warte, bis die Fläche aufleuchtet, und tippe so schnell wie möglich.
   Punkte pro Versuch: 100 bei 150 oder schneller, 0 bei 650 oder langsamer (linear).
   Score = Summe aller Versuche (max. 500). Zu früh getippt = Versuch zählt nicht, neuer Anlauf. */
GAMES.push((() => {
  const ID = 'reaction', TRIES = 5; let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const pts = ms => Math.max(0, Math.min(100, Math.round((650 - ms) / 5)));

  return {
    id: ID, title: 'Reaktionstest', players: 1,
    description: 'Warte auf das Signal und tippe so schnell du kannst. Fünf Versuche, je schneller, desto mehr Punkte.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Reaktionstest', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      const field = h('div', 'field react idle'), pad = h('div', 'layer pad'), msg = h('div', 'msg');
      const corner = h('div', 'corner num', '0'), chip = h('div', 'tag chip'), act = h('div', 'actions');
      pad.tabIndex = 0; pad.setAttribute('role', 'button'); pad.setAttribute('aria-label', 'Reaktionsfläche');
      field.append(pad, msg, corner, chip, act); stage.append(field);

      let state = 'idle', n = 0, total = 0, results = [], tGo = 0, lockUntil = 0;

      /* Anzeige: Zustand (steuert Farbe), Haupttext, Nebentext */
      function show(st, main, sub, isNum) {
        state = st; field.className = 'field react ' + st;
        const m = h('div', 'main' + (isNum ? ' num' : ''), main);
        msg.replaceChildren(m); if (sub) msg.append(h('div', 'sub', sub));
        corner.textContent = String(total);
        chip.textContent = st === 'idle' || st === 'done' ? '' : 'Versuch ' + Math.min(n + 1, TRIES);
        chip.style.display = chip.textContent ? '' : 'none';
      }
      function reset() { clear(); n = 0; total = 0; results = []; act.replaceChildren(); }

      function startWait() {
        show('wait', 'Warten …', 'Tippe erst, wenn es leuchtet');
        later(() => { tGo = performance.now(); show('go', 'Jetzt!', ''); }, rnd(1500, 4000));
      }

      function finish() {
        const isNew = total > 0 && total > Score.getBest(ID); Score.submitScore(ID, total); refreshBest();
        show('done', 'Fertig', results.join(' · '));
        if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn', 'Nochmal'); again.onclick = () => { reset(); startWait(); };
        act.append(again); again.focus({ preventScroll: true });
      }

      /* ts = Zeitstempel des Eingabeereignisses (genauer als "jetzt") */
      function press(ts) {
        if (ts < lockUntil || state === 'done') return;
        if (state === 'idle') { reset(); startWait(); }
        else if (state === 'wait') {
          clear(); lockUntil = ts + 600;
          show('early', 'Zu früh', 'Tippen für einen neuen Anlauf');
        } else if (state === 'go') {
          const ms = Math.max(0, Math.round(ts - tGo)), p = pts(ms);
          results.push(p); total += p; n++;
          if (n >= TRIES) return finish();
          lockUntil = ts + 500;
          show('shown', String(ms), 'Punkte ' + p + ' · Tippen für den nächsten Versuch', true);
        } else startWait(); /* early, shown */
      }

      pad.addEventListener('pointerdown', e => { press(e.timeStamp); });
      pad.addEventListener('keydown', e => {
        if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(e.timeStamp); }
      });
      show('idle', 'Tippen zum Start', TRIES + ' Versuche');
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 4: Schätzspiel (estimate) ----------
   5 Runden mit zufälligen Aufgaben: Winkel, Kreisanteil oder Länge schätzen. Eingabe per vertikalem Slider.
   Punkte pro Runde: 100 * e^(-(Fehler/Toleranz)^1.5). Toleranz: Winkel 15, Kreisanteil 12, Länge 15 (relativ zum Sollwert).
   Score = Summe aller Runden (max. 500). */
GAMES.push((() => {
  const ID = 'estimate', ROUNDS = 5, NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const pt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];
  const f1 = n => n.toFixed(2);

  /* Aufgabentypen: liefern { prompt, max, truth, tol, rel, draw() } */
  const TYPES = {
    angle() {
      const a = rnd(15, 165), rot = rnd(0, 359);
      return { prompt: 'Winkel schätzen (0 bis 180)', max: 180, truth: a, tol: 15, rel: false, draw() {
        const g = el('g', {}), p1 = pt(50, 30, 26, rot), p2 = pt(50, 30, 26, rot + a);
        g.append(el('line', { class: 'ray', x1: 50, y1: 30, x2: f1(p1[0]), y2: f1(p1[1]) }),
                 el('line', { class: 'ray', x1: 50, y1: 30, x2: f1(p2[0]), y2: f1(p2[1]) }),
                 el('circle', { class: 'dot', cx: 50, cy: 30, r: 1.6 }));
        return g;
      } };
    },
    pie() {
      const p = rnd(8, 92), start = rnd(0, 359);
      return { prompt: 'Kreisanteil schätzen (0 bis 100)', max: 100, truth: p, tol: 12, rel: false, draw() {
        const g = el('g', {}), a = p * 3.6, s = pt(50, 30, 25, start), e = pt(50, 30, 25, start + a);
        g.append(el('circle', { class: 'pie-bg', cx: 50, cy: 30, r: 25 }),
                 el('path', { class: 'pie', d: `M50 30 L${f1(s[0])} ${f1(s[1])} A25 25 0 ${a > 180 ? 1 : 0} 1 ${f1(e[0])} ${f1(e[1])} Z` }),
                 el('circle', { class: 'rim', cx: 50, cy: 30, r: 25 }));
        return g;
      } };
    },
    length() {
      const L = rnd(8, 88); /* Referenz: 40 Einheiten = 100 */
      return { prompt: 'Länge schätzen: obere Linie = 100', max: 250, truth: Math.round(L * 2.5), tol: 15, rel: true, draw() {
        const g = el('g', {}), t = el('text', { class: 'svgtxt', x: 30, y: 12, 'text-anchor': 'middle' });
        t.textContent = '100';
        g.append(t,
          el('line', { class: 'ln ref', x1: 10, y1: 18, x2: 50, y2: 18 }), el('line', { class: 'ln ref', x1: 10, y1: 15.5, x2: 10, y2: 20.5 }), el('line', { class: 'ln ref', x1: 50, y1: 15.5, x2: 50, y2: 20.5 }),
          el('line', { class: 'ln', x1: 10, y1: 42, x2: 10 + L, y2: 42 }), el('line', { class: 'ln', x1: 10, y1: 39.5, x2: 10, y2: 44.5 }), el('line', { class: 'ln', x1: 10 + L, y1: 39.5, x2: 10 + L, y2: 44.5 }));
        return g;
      } };
    }
  };

  /* 5 Aufgaben: jeder Typ mindestens einmal, zwei weitere zufällig, dann mischen */
  function makeTasks() {
    const keys = Object.keys(TYPES), list = [...keys, keys[Math.floor(Math.random() * 3)], keys[Math.floor(Math.random() * 3)]];
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    return list.map(k => TYPES[k]());
  }

  return {
    id: ID, title: 'Schätzspiel', players: 1,
    description: 'Schätze Winkel, Kreisanteile und Längen nach Augenmaß. Fünf Runden, je genauer, desto mehr Punkte.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Schätzspiel', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);
      let tasks = [], round = 0, total = 0, results = [];

      function newGame() { tasks = makeTasks(); round = 0; total = 0; results = []; ask(); }

      function ask() {
        stage.replaceChildren();
        const t = tasks[round]; let guess = 0;
        const field = h('div', 'field est'), fig = h('div', 'layer fig'), corner = h('div', 'corner num', '0');
        const prompt = h('div', 'tag top chip', t.prompt), tags = h('div', 'tags'), act = h('div', 'actions');
        const go = h('button', 'btn primary', 'Abschicken');
        const svg = el('svg', { viewBox: '0 0 100 60', 'aria-hidden': 'true' }); svg.append(t.draw()); fig.append(svg);
        tags.append(h('span', 'chip', 'Runde ' + (round + 1) + ' von ' + ROUNDS)); act.append(go);
        field.append(fig, prompt, corner, tags, act);

        /* Slider: Füllung folgt dem Griff */
        const sl = slider('Tipp', 'Schätzwert', t.max, v => {
          guess = Math.round(v); corner.textContent = String(guess);
          const T = sl.thumb.offsetHeight || 44;
          sl.track.style.background = `linear-gradient(to top,var(--accent) calc(${T / 2}px + (100% - ${T}px) * ${v / t.max}),var(--bg2) 0)`;
        });
        sl.thumb.style.background = 'var(--accent)';
        const sw = h('div', 'sliders'); sw.append(sl.el);
        stage.append(sw, field);
        sl.set(0, true);

        go.onclick = () => {
          const err = t.rel ? Math.abs(guess - t.truth) / t.truth * 100 : Math.abs(guess - t.truth);
          const p = Math.round(100 * Math.exp(-Math.pow(err / t.tol, 1.5)));
          total += p; results.push(p);
          sl.track.style.pointerEvents = 'none'; sl.track.tabIndex = -1;
          tags.append(h('span', 'chip', 'Tipp ' + guess), h('span', 'chip key', 'Richtig ' + t.truth), h('span', 'chip', 'Punkte ' + p));
          const next = h('button', 'btn primary', round + 1 < ROUNDS ? 'Weiter' : 'Ergebnis');
          next.onclick = () => { round++; round < ROUNDS ? ask() : finish(); };
          act.replaceChildren(next); next.focus({ preventScroll: true });
        };
      }

      function finish() {
        stage.replaceChildren();
        const isNew = total > 0 && total > Score.getBest(ID); Score.submitScore(ID, total); refreshBest();
        const field = h('div', 'field est'), bg = h('div', 'layer'), msg = h('div', 'msg'), corner = h('div', 'corner num', String(total)), act = h('div', 'actions');
        msg.append(h('div', 'main', 'Fertig'), h('div', 'sub', results.join(' · ')));
        if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn', 'Nochmal'); again.onclick = newGame; act.append(again);
        field.append(bg, msg, corner, act); stage.append(field); again.focus({ preventScroll: true });
      }

      newGame();
    }
  };
})());

/* ---------- Spiel 5: Stroop-Test (stroop) ----------
   30 Sekunden: Ein Farbwort erscheint meist in einer anderen Schriftfarbe. Tippe auf die Schriftfarbe, nicht auf das Wort.
   Richtig = +1, falsch = -1 (nie unter 0). Score = Punktestand nach Ablauf der Zeit.
   Bedienung: Antippen oder Tasten 1 bis 4. */
GAMES.push((() => {
  const ID = 'stroop', TIME = 30;
  const COLORS = [{ name: 'Rot', c: '#ef6a56' }, { name: 'Blau', c: '#5ea8f5' }, { name: 'Gelb', c: '#f5d547' }, { name: 'Grün', c: '#5ccb83' }];
  let timers = [], iv = 0, onKey = null;
  const clear = () => {
    timers.forEach(clearTimeout); timers = []; clearInterval(iv);
    if (onKey) { document.removeEventListener('keydown', onKey); onKey = null; }
  };

  return {
    id: ID, title: 'Stroop-Test', players: 1,
    description: 'Tippe auf die Farbe der Schrift, nicht auf das Wort. Dreißig Sekunden, jeder Fehler kostet einen Punkt.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Stroop-Test', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      const field = h('div', 'field stroop idle'), bg = h('div', 'layer'), msg = h('div', 'msg'), stim = h('div', 'stim');
      const corner = h('div', 'corner num', String(TIME)), chip = h('div', 'tag chip'), opts = h('div', 'opts'), act = h('div', 'actions');
      field.append(bg, msg, stim, corner, chip, opts, act); stage.append(field);

      let phase = 'idle', score = 0, right = 0, wrong = 0, end = 0, cur = null;
      COLORS.forEach((col, i) => {
        const b = h('button', 'btn', col.name); b.type = 'button'; b.setAttribute('aria-label', col.name + ' (Taste ' + (i + 1) + ')');
        b.onclick = () => answer(i); opts.append(b);
      });
      const view = ph => { phase = ph; field.className = 'field stroop ' + ph; };

      function idle() {
        clear(); view('idle'); act.replaceChildren();
        msg.replaceChildren(h('div', 'main', 'Stroop-Test'), h('div', 'sub', 'Tippe auf die Farbe der Schrift, nicht auf das Wort. Du hast ' + TIME + ' Sekunden: richtig gibt einen Punkt, falsch kostet einen.'));
        const go = h('button', 'btn primary', 'Start'); go.onclick = begin; act.append(go); go.focus({ preventScroll: true });
      }

      function nextStim() {
        let w, i;
        do { w = Math.floor(Math.random() * 4); i = Math.random() < .8 ? (w + 1 + Math.floor(Math.random() * 3)) % 4 : w; }
        while (cur && cur.word === w && cur.ink === i);
        cur = { word: w, ink: i }; stim.textContent = COLORS[w].name; stim.style.color = COLORS[i].c;
      }

      function begin() {
        clear(); score = 0; right = 0; wrong = 0; cur = null; act.replaceChildren(); view('play');
        end = performance.now() + TIME * 1000; corner.textContent = String(TIME); chip.textContent = 'Punkte 0'; nextStim();
        onKey = e => { if (/^[1-4]$/.test(e.key) && !e.repeat) answer(+e.key - 1); };
        document.addEventListener('keydown', onKey);
        iv = setInterval(() => {
          corner.textContent = String(Math.max(0, Math.ceil((end - performance.now()) / 1000)));
          if (performance.now() >= end) finish();
        }, 100);
      }

      function answer(i) {
        if (phase !== 'play') return;
        const ok = i === cur.ink;
        if (ok) { score++; right++; } else { score = Math.max(0, score - 1); wrong++; }
        field.classList.add(ok ? 'ok' : 'bad'); timers.push(setTimeout(() => field.classList.remove('ok', 'bad'), 220));
        chip.textContent = 'Punkte ' + score; nextStim();
      }

      function finish() {
        clear(); view('done');
        const isNew = score > 0 && score > Score.getBest(ID); Score.submitScore(ID, score); refreshBest();
        msg.replaceChildren(h('div', 'main', 'Zeit um'), h('div', 'sub', 'Richtig ' + right + ' · Falsch ' + wrong));
        corner.textContent = String(score); chip.textContent = 'Endstand';
        act.replaceChildren(); if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn', 'Nochmal'); again.onclick = begin; act.append(again); again.focus({ preventScroll: true });
      }

      idle();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 6: Mastermind (mastermind) ----------
   Knacke den geheimen Farbcode (4 Plätze, 6 Farben, Wiederholungen möglich) in höchstens 10 Versuchen.
   Rückmeldung pro Versuch: voller Punkt = Farbe und Platz richtig, Ring = Farbe kommt vor, steht aber woanders.
   Score = 110 - 10 * Versuche (100 bis 10). Nicht geknackt = 0. */
GAMES.push((() => {
  const ID = 'mastermind', LEN = 4, MAXTRY = 10;
  const COLORS = [{ name: 'Rot', c: '#ef6a56' }, { name: 'Gelb', c: '#f5d547' }, { name: 'Grün', c: '#5ccb83' },
                  { name: 'Blau', c: '#5ea8f5' }, { name: 'Violett', c: '#b790f2' }, { name: 'Weiß', c: '#f3eee4' }];

  /* exact = richtige Farbe am richtigen Platz; color = richtige Farbe am falschen Platz (jede Farbe nur einmal gezählt) */
  function feedback(secret, guess) {
    let exact = 0, color = 0; const s = [], g = [];
    for (let i = 0; i < LEN; i++) { if (secret[i] === guess[i]) exact++; else { s.push(secret[i]); g.push(guess[i]); } }
    for (const x of g) { const k = s.indexOf(x); if (k > -1) { color++; s.splice(k, 1); } }
    return { exact, color };
  }

  return {
    id: ID, title: 'Mastermind', players: 1,
    description: 'Knacke den geheimen Farbcode aus vier Farben in höchstens zehn Versuchen. Je weniger Versuche, desto mehr Punkte.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Mastermind', ID, api);
      const stage = h('div', 'stage mm'); c.append(bar, stage);
      const board = h('div', 'mboard'), side = h('div', 'mside');
      const status = h('p', 'mstatus'), slotsEl = h('div', 'slots'), pal = h('div', 'palette'), act = h('div', 'macts');
      const legend = h('p', 'legend', '● Farbe + Platz richtig · ○ nur Farbe richtig');
      side.append(status, slotsEl, pal, act, legend); stage.append(board, side);

      /* Verlaufstafel: MAXTRY Zeilen mit je LEN Steinen und LEN Rückmelde-Punkten */
      const rows = [];
      for (let r = 0; r < MAXTRY; r++) {
        const row = h('div', 'mrow'), pegs = h('div', 'mpegs'), pins = h('div', 'mpins'), pg = [], pn = [];
        for (let i = 0; i < LEN; i++) { const p = h('span', 'mp'), q = h('span', 'mpin'); pegs.append(p); pins.append(q); pg.push(p); pn.push(q); }
        row.append(pegs, pins); board.append(row); rows.push({ el: row, pg, pn });
      }
      /* Eingabe: LEN Plätze (Antippen leert den Platz) und eine Farbpalette */
      const slots = [];
      for (let i = 0; i < LEN; i++) { const b = h('button', 'slot'); b.type = 'button'; b.onclick = () => clearSlot(i); slots.push(b); slotsEl.append(b); }
      COLORS.forEach((col, i) => {
        const b = h('button', 'sw'); b.type = 'button'; b.style.background = col.c; b.setAttribute('aria-label', col.name); b.onclick = () => place(i); pal.append(b);
      });
      const check = h('button', 'btn primary', 'Prüfen'), undo = h('button', 'btn ghost', 'Löschen');
      check.onclick = submit; undo.onclick = removeLast;

      let secret = [], guess = [], attempt = 0, phase = 'play';

      function paint(el, idx) { el.style.background = idx >= 0 ? COLORS[idx].c : ''; el.classList.toggle('f', idx >= 0); }

      function render() {
        slots.forEach((s, i) => { paint(s, guess[i]); s.setAttribute('aria-label', 'Platz ' + (i + 1) + ': ' + (guess[i] >= 0 ? COLORS[guess[i]].name : 'leer')); });
        if (rows[attempt]) rows[attempt].pg.forEach((p, i) => paint(p, guess[i]));
        rows.forEach((r, i) => r.el.classList.toggle('cur', phase === 'play' && i === attempt));
        check.disabled = guess.includes(-1);
        if (phase === 'play') status.textContent = 'Versuch ' + (attempt + 1) + ' von ' + MAXTRY;
      }

      function place(ci) { if (phase !== 'play') return; const k = guess.indexOf(-1); if (k > -1) { guess[k] = ci; render(); } }
      function clearSlot(i) { if (phase !== 'play') return; guess[i] = -1; render(); }
      function removeLast() { if (phase !== 'play') return; for (let i = LEN - 1; i >= 0; i--) if (guess[i] >= 0) { guess[i] = -1; break; } render(); }

      function submit() {
        if (phase !== 'play' || guess.includes(-1)) return;
        const fb = feedback(secret, guess), r = rows[attempt];
        for (let i = 0; i < fb.exact; i++) r.pn[i].classList.add('x');
        for (let i = fb.exact; i < fb.exact + fb.color; i++) r.pn[i].classList.add('c');
        if (fb.exact === LEN) return end(true);
        attempt++;
        if (attempt >= MAXTRY) return end(false);
        guess = Array(LEN).fill(-1); render();
      }

      function end(win) {
        phase = 'over'; side.classList.add('over');
        const n = win ? attempt + 1 : MAXTRY, score = win ? 110 - 10 * n : 0;
        const isNew = score > 0 && score > Score.getBest(ID); Score.submitScore(ID, score); refreshBest();
        slots.forEach((s, i) => { paint(s, secret[i]); s.setAttribute('aria-label', 'Lösung, Platz ' + (i + 1) + ': ' + COLORS[secret[i]].name); });
        status.replaceChildren(win ? 'Geknackt in ' + n + ' Versuchen · Punkte ' + score : 'Nicht geknackt · Punkte 0', h('br'), win ? 'Das war der Code.' : 'Das war die Lösung:');
        rows.forEach(r => r.el.classList.remove('cur'));
        act.replaceChildren(); if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn primary', 'Nochmal'); again.onclick = newGame; act.append(again); again.focus({ preventScroll: true });
      }

      function newGame() {
        secret = Array.from({ length: LEN }, () => Math.floor(Math.random() * COLORS.length));
        guess = Array(LEN).fill(-1); attempt = 0; phase = 'play'; side.classList.remove('over');
        rows.forEach(r => { r.pg.forEach(p => { p.style.background = ''; p.classList.remove('f'); }); r.pn.forEach(q => { q.className = 'mpin'; }); });
        act.replaceChildren(check, undo); render();
      }

      newGame();
    }
  };
})());

/* ============ ROUTER ============
   Hash-Routing: #color-picker öffnet das Spiel, leer = Übersicht. */
const app = document.getElementById('app'); let active = null;
const api = { Score, h, back: () => { location.hash = ''; } };

function home() {
  const v = h('main', 'view home');
  v.append(h('h1', null, 'Spielstube'), h('p', 'lead', 'Kleine Spiele für zwischendurch. Wähle eines aus und versuche, deinen Bestwert zu schlagen.'));
  const g = h('div', 'grid');
  GAMES.forEach(game => {
    const a = h('a', 'card'); a.href = '#' + game.id;
    const l = h('div'); l.append(h('h2', null, game.title), h('p', null, game.description));
    const m = h('div', 'meta', game.bestLabel || 'Bestwert'); m.append(h('span', 'num', String(game.getBest ? game.getBest() : Score.getBest(game.id))));
    a.append(l, m); g.append(a);
  });
  v.append(g); return v;
}

/* Zeigt Fehler sichtbar an, statt einen leeren Bildschirm zu hinterlassen */
function showError(e) {
  app.replaceChildren();
  const v = h('main', 'view home');
  v.append(h('h1', null, 'Fehler'), h('p', 'lead', String((e && e.message) || e)));
  const b = h('button', 'btn', 'Zur Übersicht'); b.onclick = () => { location.hash = ''; location.reload(); };
  v.append(b); app.append(v);
}

function route() {
  try {
    if (active && active.destroy) active.destroy(); active = null;
    const id = location.hash.replace(/^#\/?/, ''), game = GAMES.find(x => x.id === id);
    app.replaceChildren();
    if (game) {
      const v = h('main', 'view'); app.append(v); active = game; game.init(v, api);
    } else app.append(home());
  } catch (e) { showError(e); }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
