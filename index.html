<!DOCTYPE html>
<!--
=====================================================================================================
SPIELSTUBE - Dokumentation für Menschen und KI (lies das zuerst, dann ist der Rest der Datei verständlich)
=====================================================================================================

WAS IST DAS?
  Eine Website mit kleinen Einzelspieler-Spielen. Genau EINE selbstständige HTML-Datei: HTML, CSS und
  JavaScript stehen inline in dieser Datei. Es gibt keine Abhängigkeiten, außer optional Google Fonts
  (mit Fallback-Schriften, die Seite funktioniert auch ohne). Kein Framework, kein Build-Schritt.
  Alle sichtbaren Texte sind auf Deutsch. Nur Dark Mode. Optimiert für iPad im Querformat und Handys
  (Hoch- und Querformat), bedienbar per Touch, Maus und Tastatur.

DATEIAUFBAU (von oben nach unten)
  1. Diese Dokumentation (HTML-Kommentar).
  2. <style>: gesamtes CSS, in nummerierten Abschnitten.
  3. <script>:
       a) Score-Modul          (Highscores in localStorage, mit Fallback auf den Arbeitsspeicher)
       b) Hilfsfunktionen      (h = Element bauen, Farbfunktionen, gameBar, slider)
       c) Spiel-Registry       (GAMES-Array; jedes Spiel ist EIN Objekt, siehe unten)
       d) Die Spiele           (6 Stück, jeweils ein GAMES.push(...) mit eigener Beschreibung)
       e) Router               (Startseite, Hash-Routing, Fehleranzeige)

SPIELE (Registry-ID = URL-Hash, z. B. index.html#stroop)
  Registry-ID      Score-ID(s) im Speicher                    Besser =   Kurzregel
  color-picker     color-picker                               höher      Farbe 5 s merken, per H/S/L-Slider nachmischen. Score 0..100:
                                                                         60 % Farbton, 20 % Sättigung, 20 % Helligkeit.
  block-sequence   block-sequence-2 ... block-sequence-6      höher      Blockfolge nachtippen (Raster 2x2 bis 6x6), Score = Länge der Folge.
  reaction         reaction-ms                                NIEDRIGER  5 Reaktionen, Bestwert = Durchschnitt in Millisekunden.
  estimate         estimate                                   höher      5 Schätzaufgaben (Winkel, Kreisanteil, Länge), Score 0..500.
  stroop           stroop-4, stroop-6, stroop-8               höher      Schriftfarbe statt Wort antippen, 30 s, 4/6/8 Farben.
  mastermind       mastermind                                 höher      Farbcode knacken, Score = 110 - 10 * Versuche (100 bis 10).
  Alte, nicht mehr verwendete Speicher-Schlüssel (block-sequence, reaction, stroop) werden ignoriert.

ARCHITEKTUR-KERN: SPIEL-REGISTRY
  const GAMES = [] enthält Spielobjekte { id, title, description, players, init(container, api), ... }.
  Die Startseite (home) und der Router (route) bauen Karten und Seiten ausschließlich aus diesem Array.
  Ein neues Spiel = ein weiteres GAMES.push({...}) im Abschnitt "Spiele". Nichts anderes muss geändert werden.
  Details und alle optionalen Felder stehen im Kommentarblock "SPIEL-REGISTRY" im Script.

HIGHSCORES
  localStorage-Key "spielstube.scores" enthält JSON: { "<score-id>": { "best": <Zahl> } }.
  Zugriff NUR über das Score-Modul (getBest, has, submitScore). Alle Zugriffe sind try/catch-gesichert,
  ohne Speicher läuft alles weiter (dann nur bis zum Neuladen der Seite).
  Standard: höherer Wert ist besser. Für "niedriger ist besser" (Reaktionstest) übergibt man
  { lowerIsBetter: true } an submitScore und nutzt has() zur Unterscheidung "noch kein Wert".

KONVENTIONEN
  - Zahlen werden als ganze Zahlen angezeigt. Einheiten nur dort, wo ausdrücklich gewünscht:
    Reaktionstest (Millisekunden, "ms") und Punkteanzeigen der Form "76/100".
  - Design: warmes Fast-Schwarz, EINE Akzentfarbe (Ocker), Instrument Serif für Titel, IBM Plex Mono für Zahlen
    und Bedienelemente. Keine Emojis, keine Verläufe als Dekoration, keine Glas- oder Schatteneffekte.
  - Alle Farben und Maße kommen aus den CSS-Variablen in :root (siehe CSS-Abschnitt 1).
  - Hover-Effekte stehen IMMER in @media (hover:hover). Sonst bleibt auf Touchgeräten nach dem Antippen
    der Hover-Zustand "kleben" (sichtbar als heller Rand oder invertierter Button).
  - Touch-Flächen sind mindestens 44 px groß. Slider nutzen Pointer Events und touch-action:none.
  - Höhen mit dvh, Safe Areas über env(safe-area-inset-*) am :root.
  - Gemeinsame Bausteine: Klassen .btn .chip .num .card .field .layer .corner .tag .actions .msg .sl .lvl,
    Funktionen h(), gameBar(), slider().
  - Jedes Spiel räumt in destroy() Timer und Listener auf (der Router ruft es beim Verlassen auf).

TESTEN (ohne Build): Datei im Browser öffnen. Direkt ins Spiel: Datei.html#estimate usw.
  Die Seite zeigt Fehler im Router sichtbar an (Seite "Fehler"), statt leer zu bleiben.
=====================================================================================================
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spielstube</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Schriften laden nicht-blockierend: Die Seite erscheint sofort, auch wenn Google Fonts langsam oder nicht erreichbar ist -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
/* =====================================================================================
   CSS-ÜBERSICHT: 1 Grundlagen | 2 Bausteine | 3 Startseite | 4 Spielgerüst | 5 Slider + Color Picker
   6 Levelauswahl | 7 Blockfolge | 8 Allgemeine Responsive-Regeln | 9 Reaktionstest | 10 Schätzspiel
   11 Stroop-Test | 12 Mastermind | 13 Kopfzeile auf schmalen Geräten | 14 Reduzierte Bewegung
   Wichtig: Die Reihenfolge ist relevant (spätere Regeln überschreiben frühere gleicher Spezifität).
   ===================================================================================== */

/* ---------- 1. Grundlagen: Variablen, Reset, Seitenrahmen ---------- */
:root{
  /* Palette: bg = Seitenhintergrund, bg2 = Flächen/Karten, line = feine Linien, ink = Haupttext,
     dim = Nebentext, accent = die EINE Akzentfarbe, bad = Fehler/falsch, good = richtig */
  --bg:#161310; --bg2:#25201b; --line:#4d453b; --ink:#f7f2e8; --dim:#b8ae9d; --accent:#f2b94b; --bad:#e5604d; --good:#5ccb83;
  --r:28px;                              /* großer Eckenradius für Flächen und Karten */
  --gap:16px;                            /* Standardabstand */
  --pad:clamp(16px,3vw,28px);            /* Innenabstand der Spielflächen, wächst mit der Breite */
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  /* Safe Areas (Notch, Home-Indikator) */
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{height:100%;color:var(--ink);font:400 16px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
/* .view = ein ganzer Bildschirm (Startseite oder Spiel), blendet beim Wechsel kurz ein */
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 2. Wiederverwendbare Bausteine ---------- */
/* Button: Basis = Umriss. Varianten: .primary (Akzentfläche), .ghost (zurückhaltend). */
.btn{min-height:52px;min-width:52px;padding:0 28px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:500 15px var(--mono);border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;touch-action:manipulation}
.btn:focus-visible{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1308}
.btn.primary:focus-visible{background:var(--ink);border-color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--dim);padding:0 22px}
.btn.ghost:focus-visible{border-color:var(--ink);background:transparent;color:var(--ink)}
@media (hover:hover){
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn.primary:hover{background:var(--ink);border-color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}   /* Tastaturfokus: Akzentring */
/* .num = Zahlendarstellung (Monospace, gleich breite Ziffern) */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;line-height:1}
/* .chip = kleine Pille mit Text (Beschriftungen, Hinweise) */
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:500;line-height:1}

/* ---------- 3. Startseite ---------- */
.card{display:grid;grid-template-columns:1fr auto;gap:var(--gap) 24px;align-items:end;padding:32px;border:2px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;background:var(--bg2);transition:border-color .25s,transform .25s var(--ease)}
.card:focus-visible{border-color:var(--accent);transform:translateY(-3px)}
@media (hover:hover){.card:hover{border-color:var(--accent);transform:translateY(-3px)}}
.card h2{margin:0;font:400 44px/1 var(--display)}
.card p{margin:12px 0 0;color:var(--dim);font-size:15px;max-width:46ch}
.card .meta{text-align:right;color:var(--dim);font-size:14px}
.card .meta .num{display:block;color:var(--accent);font-size:44px;margin-top:8px}
.home{padding:clamp(24px,6vw,72px);overflow:auto}
.home h1{margin:0 0 12px;font:400 clamp(56px,11vw,128px)/.9 var(--display);letter-spacing:-.02em}
.home .lead{margin:0 0 clamp(32px,6vw,64px);color:var(--dim);max-width:44ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:var(--gap)}

/* ---------- 4. Spielgerüst: Kopfzeile (.bar) und Spielfläche (.stage) ---------- */
.bar{display:flex;align-items:center;gap:var(--gap);padding:var(--gap) var(--pad)}
.bar h2{margin:0;font:400 32px/1 var(--display);flex:1}
.bar .best{color:var(--dim);font-size:14px;display:flex;gap:12px;align-items:baseline}
.bar .best .num{color:var(--accent);font-size:26px}
.stage{flex:1;min-height:0;display:flex;gap:var(--gap);padding:0 var(--pad) var(--pad)}

/* ---------- 5. Slider (gemeinsamer Baustein) und Color Picker ---------- */
.sliders{display:flex;gap:12px;flex:none}                 /* Container für einen oder mehrere Slider */
.sl{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(56px,7vw,76px)}
.sl .track{position:relative;flex:1;width:100%;min-height:0;border-radius:999px;box-shadow:0 0 0 2px var(--line);touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.sl .thumb{position:absolute;left:50%;width:44px;height:44px;transform:translateX(-50%);border-radius:50%;border:4px solid var(--ink);background:var(--ink);box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.sl label{color:var(--ink);font-size:14px;font-weight:500;height:20px}
/* .field = große abgerundete Fläche. Kinder: .layer (Vollflächen-Ebene), .corner (große Zahl oben rechts),
   .tag (Chip unten links), .actions (Buttons unten rechts), .msg (zentrierter Text) */
.field{position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.field .layer{position:absolute;inset:0}
.field .corner{position:absolute;top:var(--pad);right:calc(var(--pad) + 4px);font-size:clamp(48px,9vw,120px);transition:color .2s}
.field .tag{position:absolute;bottom:var(--pad)}
.field .actions{position:absolute;right:var(--pad);bottom:var(--pad);display:flex;gap:12px;align-items:center}
.field .note{color:var(--accent);animation:enter .4s var(--ease)}   /* Hinweis "Neuer Bestwert" */
.field .actions .btn{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.field .actions .btn:focus-visible{background:var(--accent);border-color:var(--accent);color:#1a1308}
@media (hover:hover){.field .actions .btn:hover{background:var(--accent);border-color:var(--accent);color:#1a1308}}
/* .msg = zentrierter Haupttext (.main) mit Nebenzeilen (.sub); wird von mehreren Spielen benutzt */
.msg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:var(--pad);pointer-events:none}
.msg .main{font:400 clamp(40px,8vw,96px)/1 var(--display)}
.msg .main.num{font-size:clamp(64px,14vw,160px)}
.msg .main small{font-size:.28em;font-weight:500;opacity:.7;margin-left:.25em}   /* Einheit hinter großer Zahl */
.msg .sub{font-size:15px;opacity:.85}
/* Color-Picker-Ergebnis: Originalfarbe links, eigene Farbe wird von rechts aufgedeckt */
.compare .mine{clip-path:inset(0 0 0 100%);transition:clip-path .9s var(--ease) .15s}
.compare.go .mine{clip-path:inset(0 0 0 50%)}

/* ---------- 6. Levelauswahl (Blockfolge und Stroop-Test) ---------- */
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--gap);align-content:center;overflow:auto}
.lvl{display:flex;flex-direction:column;gap:8px;text-align:left;padding:clamp(16px,2vw,28px);border:2px solid var(--line);border-radius:var(--r);background:var(--bg2);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .25s,transform .25s var(--ease);touch-action:manipulation}
.lvl:focus-visible{border-color:var(--accent);transform:translateY(-3px)}
@media (hover:hover){.lvl:hover{border-color:var(--accent);transform:translateY(-3px)}}
.lvl .size{font-size:clamp(34px,5vw,64px);color:var(--accent)}
.lvl .size small{font-size:.3em;font-weight:500;color:var(--dim);margin-left:.3em}
.lvl .name{font:400 clamp(26px,3vw,38px)/1 var(--display);margin-top:8px}
.lvl .rec{color:var(--dim);font-size:14px;margin-top:8px}
.lvl .rec .num{color:var(--ink);margin-left:8px;font-size:18px}

/* ---------- 7. Blockfolge ---------- */
.seq{align-items:stretch}
.side{display:flex;flex-direction:column;justify-content:center;gap:var(--gap);width:clamp(180px,24vw,280px);flex:none}
.side .big{font-size:clamp(64px,12vw,140px);color:var(--accent)}
.side .lbl{color:var(--dim);font-size:14px;margin-top:-8px}
.side .status{margin:0;font-size:16px;min-height:48px}
.side .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:52px}
.side .actions .note{color:var(--accent);background:var(--bg2)}
.board-wrap{flex:1;min-width:0;min-height:0;container-type:size;display:grid;place-items:center}
.board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;gap:clamp(6px,1.4cqmin,16px)}   /* immer quadratisch */
.cell{border:2px solid var(--line);background:var(--bg2);border-radius:clamp(10px,2.6cqmin,24px);padding:0;min-width:0;min-height:0;cursor:pointer;transition:background .12s,border-color .12s,transform .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cell:focus{outline:none}                                              /* kein Fokusring durch Antippen */
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:3px} /* nur bei Tastaturbedienung */
.board.locked .cell{cursor:default}
/* BEWUSST KEIN :hover-Stil auf Blöcken: Sonst erscheint nach dem Aufleuchten ein heller Rand um den Block
   unter dem Mauszeiger bzw. (Touch) um den zuletzt angetippten Block. */
.cell.lit{background:var(--accent);border-color:var(--accent);transform:scale(.94)}   /* Block der Folge leuchtet */
.cell.wrong{background:var(--bad);border-color:var(--bad)}                           /* falsch angetippt (rot) */
.cell.right{background:var(--good);border-color:var(--good)}                         /* der richtige Block (grün) */

/* ---------- 8. Allgemeine Responsive-Regeln (gelten für mehrere Spiele) ---------- */
@media (max-height:480px){      /* Handy im Querformat */
  .bar{padding-top:8px;padding-bottom:8px}.bar h2{font-size:24px}.btn{min-height:44px}
  .sl{gap:6px}.sl label{height:16px}.sl .thumb{width:40px;height:40px}.home{padding:20px}.home h1{font-size:48px}
  .side .big{font-size:56px}.side{gap:8px}
  .lvl{padding:12px}.lvl .size{font-size:32px}.lvl .name{font-size:24px;margin-top:0}
  .msg .main{font-size:44px}.msg .main.num{font-size:72px}.msg{gap:4px}
}
@media (orientation:portrait){  /* Hochformat */
  .seq{flex-direction:column}
  .side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .side .big{font-size:56px}.side .lbl{display:none}.side .status{flex:1;min-height:0}
  .levels{grid-template-columns:repeat(2,1fr);align-content:start}
}
@media (max-width:560px) and (orientation:portrait){.card{grid-template-columns:1fr}.card .meta{text-align:left}}

/* ---------- 9. Reaktionstest ---------- */
/* Zustandsklassen am .field: idle, wait, go, early, shown, done. Die Farbe der Fläche hängt am Zustand. */
.react .pad{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--bg2);transition:background .15s}
.react .pad:focus{outline:none}
.react .pad:focus-visible{outline:3px solid var(--accent);outline-offset:-6px}
.react.go .pad{background:var(--accent)}      /* Signal: jetzt tippen */
.react.early .pad{background:var(--bad)}      /* zu früh getippt */
.react.go .msg,.react.early .msg{color:#1a1308}
.react .corner{display:none}
.react .tag{left:var(--pad);pointer-events:none}
.react .actions{z-index:2}

/* ---------- 10. Schätzspiel ---------- */
.est .fig{display:grid;grid-template:minmax(0,1fr) / minmax(0,1fr);place-items:center;padding:clamp(72px,12vw,120px) var(--pad)}
.est svg{width:100%;height:100%;overflow:visible}
.est .ray,.est .ln{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;fill:none}
.est .ln.ref{stroke:var(--accent)}            /* Referenzlinie (= 100) */
.est .dot{fill:var(--ink)}
.est .pie-bg{fill:var(--bg)}
.est .pie{fill:var(--accent)}
.est .rim{fill:none;stroke:var(--line);stroke-width:.8}
.est .svgtxt{fill:var(--dim);font:500 5px var(--mono)}
.est .tag{position:absolute;max-width:58%;white-space:normal;line-height:1.3;border-radius:20px}
.est .tag.top{top:var(--pad);bottom:auto;left:var(--pad)}       /* Aufgabentext oben links */
.est .tags{position:absolute;left:var(--pad);bottom:var(--pad);display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 190px)}
/* Ergebnis einer Runde: große Werte in einer Leiste (.rpanel) am unteren Rand */
.est.res .corner{display:none}
.est.res .fig{padding-bottom:calc(var(--pad) + 124px)}
.est .rpanel{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad);z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:14px 16px 14px 24px;border-radius:26px;background:var(--bg);box-shadow:0 0 0 2px var(--line);animation:enter .35s var(--ease)}
.est .stats{display:flex;align-items:flex-end;gap:clamp(18px,4vw,48px)}
.est .stat .k{font-size:12px;color:var(--dim);margin-bottom:8px}
.est .stat .v{font-size:clamp(28px,4.6vw,44px)}
.est .stat.hero .v{color:var(--accent)}
.est .v small,.est .tv small,.est .total small{font-size:.4em;font-weight:500;color:var(--dim);margin-left:.12em}
.est .rpanel .btn{margin-left:auto}
/* Endergebnis: Summe groß (.total), darunter eine Kachel (.tile) pro Runde mit Fortschrittsbalken (.meter) */
.est .final-box{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.4vh,26px);padding:var(--pad) var(--pad) calc(var(--pad) + 76px);pointer-events:none}
.est .final-label{color:var(--dim);font-size:14px}
.est .total{font-size:clamp(64px,13vw,150px);color:var(--accent)}
.est .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px}
.est .tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:10px 12px 12px;border-radius:18px;background:var(--bg)}
.est .tn{font-size:12px;color:var(--dim);white-space:nowrap}
.est .tv{font-size:clamp(18px,3.2vw,28px)}
.est .meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.est .meter i{display:block;width:0;height:100%;border-radius:2px;background:var(--accent);transition:width .8s var(--ease)}
@media (max-height:480px){
  .est .fig{padding:56px var(--pad) 64px}.est .tag.top{max-width:50%}
  .est.res .fig{padding-bottom:calc(var(--pad) + 84px)}
  .est .rpanel{padding:8px 12px 8px 18px;border-radius:22px}
  .est .stat .k{margin-bottom:4px}.est .stat .v{font-size:26px}
  .est .total{font-size:56px}.est .final-box{gap:8px;padding-bottom:calc(var(--pad) + 62px)}
}
@media (orientation:portrait){.est.res .fig{padding-bottom:calc(var(--pad) + 170px)}}

/* ---------- 11. Stroop-Test ---------- */
/* Klassen am .field: idle | play | done (Phase), r1/r2 (Zeilen der Antwortbuttons), big (mehr als 4 Farben),
   ok/bad (kurzes Aufleuchten nach einer Antwort). Variablen: --btnh Buttonhöhe, --rows Zeilenzahl, --cols Spalten. */
.stroop{--btnh:76px;--rows:1}
.stroop.r2{--btnh:62px;--rows:2}
/* Aufleucht-Ring: als ::after mit border-radius:inherit, damit er den runden Ecken folgt (sonst wird er abgeschnitten) */
.stroop::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .15s;pointer-events:none}
.stroop.ok::after{box-shadow:inset 0 0 0 5px var(--accent)}
.stroop.bad::after{box-shadow:inset 0 0 0 5px var(--bad)}
.stroop .stim{position:absolute;inset:0 0 calc(var(--pad) + var(--rows) * var(--btnh) + (var(--rows) - 1) * 12px + 16px) 0;display:grid;place-items:center;font:400 clamp(72px,16vw,200px)/1 var(--display);pointer-events:none}
.stroop .opts{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad);display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:12px}
.stroop .opts .btn{min-height:var(--btnh);padding:0 6px;font-size:16px}
.stroop.big .opts .btn{font-size:14px;padding:0 4px}
.stroop .tag{top:var(--pad);left:var(--pad);bottom:auto}
.stroop.idle .stim,.stroop.idle .opts,.stroop.idle .tag,.stroop.idle .corner,
.stroop.done .stim,.stroop.done .opts{display:none}
.stroop.play .msg,.stroop.play .actions{display:none}
@media (max-height:480px){
  .stroop{--btnh:56px}.stroop.r2{--btnh:46px}
  .stroop .stim{font-size:80px}
}

/* ---------- 12. Mastermind ---------- */
/* --u = Höhe einer Verlaufszeile. Alle Größen des Bretts leiten sich daraus ab. Das Brett hat 11 Zeilen
   (1 Code-Zeile + 10 Versuche), die Formel berücksichtigt Kopfzeile und Ränder, damit nichts scrollt. */
.mm{--u:clamp(22px,calc((100dvh - 156px) / 11),42px);align-items:center;justify-content:center;gap:clamp(16px,4vw,56px)}
.mboard{display:flex;flex-direction:column;gap:4px;flex:none}
.mrow{height:var(--u);display:flex;align-items:center;gap:calc(var(--u) * .3);padding:0 calc(var(--u) * .35);border-radius:999px;background:var(--bg2);box-shadow:0 0 0 2px transparent;transition:box-shadow .2s}
.mrow.cur{box-shadow:0 0 0 2px var(--accent)}                  /* aktuelle Eingabezeile */
.mrow.sol{margin-bottom:6px;background:var(--bg);box-shadow:0 0 0 2px var(--line)}   /* geheimer Code (oben) */
.mpegs{display:flex;gap:calc(var(--u) * .14)}
.mp{width:calc(var(--u) * .62);height:calc(var(--u) * .62);border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.mp.f{box-shadow:none}                                         /* .f = gefüllt (hat eine Farbe) */
.mp.q{display:grid;place-items:center;font:500 calc(var(--u) * .38)/1 var(--mono);color:var(--dim)}   /* verdeckter Code: "?" */
.mrow.cur .mp.f{cursor:pointer}                                /* Stein der aktuellen Zeile antippen = entfernen */
.mpins{display:grid;grid-template-columns:repeat(2,calc(var(--u) * .22));gap:calc(var(--u) * .08)}
.mpins.ghost{visibility:hidden}                                /* Platzhalter, damit die Code-Zeile gleich breit ist */
.mpin{width:calc(var(--u) * .22);height:calc(var(--u) * .22);border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
.mpin.x{background:var(--ink);box-shadow:none}                 /* voller Punkt: Farbe UND Platz richtig */
.mpin.c{box-shadow:inset 0 0 0 2px var(--ink)}                 /* Ring: nur die Farbe stimmt */
.mside{display:flex;flex-direction:column;justify-content:center;gap:12px;width:clamp(250px,36vw,380px);flex:none}
.mstatus{margin:0;font-size:15px;min-height:46px}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
.sw{width:100%;max-width:58px;aspect-ratio:1;min-height:46px;padding:0;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line);transition:box-shadow .2s,transform .15s}
.sw:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
@media (hover:hover){.sw:hover{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}}
.sw:active{transform:scale(.92)}
.macts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:52px}
.macts .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.macts .note{color:var(--accent);background:var(--bg2)}
/* Legende: bewusst auffällig (Kasten, volle Textfarbe, echte Beispiel-Punkte) */
.legend{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:var(--bg2);box-shadow:0 0 0 2px var(--line);font-size:14px;color:var(--ink)}
.lrow{display:flex;align-items:center;gap:10px}
.legend .mpin{width:16px;height:16px;flex:none}
.lnote{color:var(--accent);font-weight:500}
.mside.over .palette,.mside.over .legend{display:none}
@media (orientation:portrait){
  .mm{--u:clamp(20px,calc((100dvh - 450px) / 11),40px);flex-direction:column;gap:12px}
  .mside{width:100%;gap:10px}
  .mstatus{min-height:0}
  .palette{grid-template-columns:repeat(6,1fr);gap:8px}
  .legend{font-size:13px;gap:6px;padding:10px 14px}   /* kompakter, damit Texte nicht umbrechen */
}
@media (max-height:480px){
  .mside{width:clamp(240px,40vw,340px);gap:8px}
  .palette{gap:8px}
  .sw{max-width:46px}
  .mstatus{font-size:14px;min-height:0}
  .macts{min-height:44px}
  .legend{font-size:12px;gap:5px;padding:8px 12px}
  .legend .mpin{width:13px;height:13px}
}

/* ---------- 13. Kopfzeile auf schmalen Geräten ---------- */
.bar .btn{flex:none}                                              /* Zurück-Button schrumpft nie */
.bar h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* lange Titel werden gekürzt */
@media (max-width:560px){
  .bar{gap:10px}.bar h2{font-size:24px}.bar .btn.ghost{padding:0 14px}
  .bar .best{font-size:12px;gap:8px}.bar .best .num{font-size:22px}
}

/* ---------- 14. Reduzierte Bewegung (Systemeinstellung) ---------- */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
