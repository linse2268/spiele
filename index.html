<body>
<div id="app"></div>
<script>
/* =====================================================================================
   A) SCORE-MODUL - Highscores
   -------------------------------------------------------------------------------------
   Speicherformat: localStorage-Key "spielstube.scores" -> JSON { "<score-id>": { "best": <Zahl> } }
   Jede Wertung hat eine eigene Score-ID (z. B. "stroop-6" = Stroop-Test mit 6 Farben).
   Ist localStorage nicht verfügbar (privater Modus, blockiert), wird nur im Arbeitsspeicher gespeichert.

   API:
     Score.getBest(id)                      -> gespeicherter Bestwert, 0 wenn es noch keinen gibt
     Score.has(id)                          -> true, wenn es bereits einen Bestwert gibt
     Score.submitScore(id, wert, optionen)  -> speichert den Wert, wenn er besser ist als der alte.
                                               optionen.lowerIsBetter = true: kleinerer Wert ist besser.
                                               Gibt true zurück, wenn ein neuer Bestwert gespeichert wurde.
   ===================================================================================== */
const Score = (() => {
  const KEY = 'spielstube.scores';
  let mem = {};                                   // Fallback, falls localStorage nicht geht
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || mem; } catch (e) { return mem; } };
  const save = d => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
  const stored = (d, id) => d[id] && typeof d[id].best === 'number' ? d[id].best : undefined;
  return {
    getBest: id => { const v = stored(load(), id); return v === undefined ? 0 : v; },
    has: id => stored(load(), id) !== undefined,
    submitScore(id, s, opts) {
      const lower = !!(opts && opts.lowerIsBetter);
      const d = load(), prev = stored(d, id);
      if (prev !== undefined && (lower ? s >= prev : s <= prev)) return false;   // nicht besser
      d[id] = { best: s }; save(d); return true;
    }
  };
})();

/* =====================================================================================
   B) HILFSFUNKTIONEN
   ===================================================================================== */

/** Baut ein DOM-Element: h('div', 'klasse1 klasse2', 'Text'). cls und txt sind optional (txt als reiner Text). */
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/** CSS-Farbstring aus HSL: H in Grad (0-360), S und L in Prozent (0-100). */
const hsl = (H, S, L) => `hsl(${H} ${S}% ${L}%)`;

/** Zufällige ganze Zahl von a bis b (beide inklusive; die Randwerte sind etwas seltener). */
const rnd = (a, b) => Math.round(a + Math.random() * (b - a));

/** HSL (H 0-360, S/L 0-100) -> sRGB als [r,g,b] mit Werten 0-1. */
function hslToRgb(H, S, L) {
  S /= 100; L /= 100; const k = n => (n + H / 30) % 12, a = S * Math.min(L, 1 - L);
  const f = n => L - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0), f(8), f(4)];
}

/** sRGB-Gammakorrektur: Farbkanal (0-1) -> linear (für die Leuchtdichte). */
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);

/** Gut lesbare Schriftfarbe (dunkel oder hell) für Text auf der HSL-Farbe c = [H,S,L], nach echter Leuchtdichte. */
const inkOn = c => { const [r, g, b] = hslToRgb(...c).map(lin); return (.2126 * r + .7152 * g + .0722 * b) > .18 ? '#14110d' : '#f7f2e8'; };

/**
 * Bewertung des Color Pickers. target und mine sind [H,S,L] (H 0-360, S/L 0-100). Ergebnis: ganze Zahl 0-100.
 * Gewichtung: 60 % Farbton (H), 20 % Sättigung (S), 20 % Helligkeit (L).
 * Jede Komponente bekommt 0-100 Punkte nach der Kurve 100 * e^(-(Abweichung/Toleranz)^1.5):
 *   Farbton: Toleranz 25 Grad (Abstand zirkulär, also 350 und 10 haben 20 Grad Abstand),
 *   Sättigung und Helligkeit: Toleranz 30 Prozentpunkte.
 * Beispiel: nur 10 Grad Farbton daneben, S und L exakt -> 87 Punkte.
 */
function colorScore(target, mine) {
  const part = (err, tol) => 100 * Math.exp(-Math.pow(err / tol, 1.5));
  const dh = Math.abs(target[0] - mine[0]), hueErr = Math.min(dh, 360 - dh);
  return Math.round(.6 * part(hueErr, 25) + .2 * part(Math.abs(target[1] - mine[1]), 30) + .2 * part(Math.abs(target[2] - mine[2]), 30));
}

/**
 * Gemeinsame Kopfzeile aller Spiele: [Zurück-Button] [Titel] [Bestwert].
 * idOrGetter: Score-ID (String) ODER Funktion, die den anzuzeigenden Wert liefert (z. B. pro Level unterschiedlich).
 * format: optionale Funktion Wert -> Text (z. B. v => v + ' ms'). Standard: String.
 * Gibt { bar, refreshBest } zurück. refreshBest() liest den Wert neu und aktualisiert die Anzeige.
 */
function gameBar(title, idOrGetter, api, format) {
  const read = typeof idOrGetter === 'function' ? idOrGetter : () => Score.getBest(idOrGetter);
  const fmt = format || String;
  const bar = h('div', 'bar'), back = h('button', 'btn ghost', 'Zurück'), best = h('div', 'best');
  back.onclick = api.back; best.append(h('span', null, 'Bestwert'));
  const bestNum = h('span', 'num', fmt(read())); best.append(bestNum);
  bar.append(back, h('h2', null, title), best);
  return { bar, refreshBest: () => { bestNum.textContent = fmt(read()); } };
}

/**
 * Gemeinsamer Baustein: vertikaler Slider (unten = Minimum, oben = Maximum), per Touch, Maus und Tastatur bedienbar.
 * Die Länge des Sliders bestimmt das Layout (CSS), min/max bestimmen nur die Werte.
 *   label   sichtbare Beschriftung unter dem Slider
 *   aria    Beschriftung für Screenreader
 *   max     größter Wert
 *   onInput Funktion(wert), wird bei jeder Änderung durch den Nutzer (und bei set(...,true)) aufgerufen
 *   min     kleinster Wert (optional, Standard 0)
 * Gibt { el, track, thumb, set(wert, feuern?), get() } zurück. Werte sind Kommazahlen; Aufrufer runden selbst.
 * Hinweis: set() muss NACH dem Einfügen ins DOM aufgerufen werden (der Griff braucht seine Größe).
 */
function slider(label, aria, max, onInput, min = 0) {
  const span = max - min;
  const sl = h('div', 'sl'), tr = h('div', 'track'), th = h('div', 'thumb'), lb = h('label', null, label);
  tr.append(th); sl.append(tr, lb);
  tr.tabIndex = 0; tr.setAttribute('role', 'slider'); tr.setAttribute('aria-label', aria); tr.setAttribute('aria-orientation', 'vertical');
  tr.setAttribute('aria-valuemin', min); tr.setAttribute('aria-valuemax', max);
  let v = min;
  /** Wert setzen (auf min..max begrenzt), Griff positionieren, optional onInput aufrufen. */
  const set = (x, fire) => {
    v = Math.max(min, Math.min(max, x));
    th.style.bottom = `calc((100% - ${th.offsetHeight || 44}px) * ${(v - min) / span})`;   // Griff bleibt komplett in der Schiene
    tr.setAttribute('aria-valuenow', Math.round(v)); if (fire) onInput(v);
  };
  /** Zeigerposition (clientY) in einen Wert umrechnen. */
  const fromY = e => {
    const r = tr.getBoundingClientRect(), T = th.offsetHeight || 44;
    set(min + Math.max(0, Math.min(1, (r.bottom - e.clientY - T / 2) / (r.height - T))) * span, true);
  };
  tr.addEventListener('pointerdown', e => { tr.setPointerCapture(e.pointerId); fromY(e); });
  tr.addEventListener('pointermove', e => { if (tr.hasPointerCapture(e.pointerId)) fromY(e); });
  tr.addEventListener('keydown', e => {            // Pfeiltasten: 1 % pro Schritt (mindestens 1), mit Shift 10 %
    const st = Math.max(1, span / 100) * (e.shiftKey ? 10 : 1), d = { ArrowUp: st, ArrowRight: st, ArrowDown: -st, ArrowLeft: -st }[e.key];
    if (d) { e.preventDefault(); set(v + d, true); }
  });
  return { el: sl, track: tr, thumb: th, set, get: () => v };
}

/* =====================================================================================
   C) SPIEL-REGISTRY
   -------------------------------------------------------------------------------------
   NEUES SPIEL HINZUFÜGEN: Unten bei "D) DIE SPIELE" ein weiteres Objekt anhängen. Sonst nichts ändern.
     GAMES.push({
       id: 'mein-spiel',            // eindeutig, wird zum URL-Hash (#mein-spiel)
       title: 'Mein Spiel',         // Titel auf Karte und in der Kopfzeile
       description: '…',            // Kurzbeschreibung auf der Karte
       players: 1,                  // 1 = Einzelspieler, 2 = Zwei-Spieler-Spiel (später)
       init(container, api) { … },  // baut das Spiel in container auf (siehe unten)
       // --- optional ---
       destroy() { … },             // Timer, Intervalle und globale Listener aufräumen
       getBest() { … },             // eigener Bestwert für die Startseitenkarte (sonst Score.getBest(id))
       formatBest(wert) { … },      // Text für den Bestwert auf der Karte (z. B. wert + ' ms')
       bestLabel: 'Bestwert (…)'    // Beschriftung des Bestwerts auf der Karte (Standard "Bestwert")
     });
   api = { Score, h, back() }: back() geht zur Startseite.
   Typisches Gerüst im init: const { bar, refreshBest } = gameBar(titel, scoreId, api);
     const stage = h('div', 'stage'); container.append(bar, stage); … danach in stage das Spiel aufbauen.
   Punkte speichern: Score.submitScore(scoreId, punkte). Jedes Spiel nutzt eigene Score-IDs.
   ===================================================================================== */
const GAMES = [];

/* =====================================================================================
   D) DIE SPIELE
   ===================================================================================== */
/* ---------- Spiel 1: Color Picker (Registry-ID "color-picker") ----------
   ABLAUF: round() zeigt 5 Sekunden eine Zufallsfarbe mit Countdown -> mix() lässt den Spieler die Farbe mit
   drei vertikalen HSL-Slidern (Hue, Saturation, Lightness) nachmischen -> result() vergleicht beide Farben
   nebeneinander, zählt den Score 3 Sekunden lang hoch (Ease-out) und zeigt "Nochmal".
   WERTUNG: colorScore() (siehe Hilfsfunktionen): 60 % Farbton, 20 % Sättigung, 20 % Helligkeit, Score 0-100.
   SPEICHER: Score-ID "color-picker" (höher = besser). Es gibt keine feste Rundenzahl. */
GAMES.push((() => {
  const ID = 'color-picker'; let timers = [], raf = 0;
  /** Stoppt Countdown-Intervall, Timeouts und die Hochzähl-Animation. */
  const clear = () => { timers.forEach(clearInterval); timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); };

  return {
    id: ID, title: 'Color Picker', players: 1,
    description: 'Merke dir eine Farbe und mische sie danach aus dem Gedächtnis nach.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Color Picker', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      /** Eine komplette Runde (Merken -> Mischen -> Ergebnis). */
      function round() {
        clear(); stage.replaceChildren();
        /* Faire Zufallsfarbe: kräftig (S 45-90) und weder zu dunkel noch zu hell (L 30-68). Format [H,S,L]. */
        const target = [rnd(0, 359), rnd(45, 90), rnd(30, 68)];
        const field = h('div', 'field'), layer = h('div', 'layer'), corner = h('div', 'corner num', '5');
        layer.style.background = hsl(...target); corner.style.color = inkOn(target);
        field.append(layer, corner); stage.append(field);

        /* Phase 1: 5 Sekunden Countdown (5, 4, 3, 2, 1, 0), danach kurz warten und zu mix() wechseln. */
        const end = Date.now() + 5000; let shown = 5;
        const iv = setInterval(() => {
          const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
          if (left !== shown) { shown = left; corner.textContent = String(left); }
          if (Date.now() >= end) { clearInterval(iv); timers.push(setTimeout(mix, 300)); }
        }, 100); timers.push(iv);

        /** Phase 2: Slider links (H, S, L), große Vorschau der eigenen Farbe rechts, Button "Abschicken". */
        function mix() {
          stage.replaceChildren();
          const cur = [180, 50, 50];                        // aktuelle Einstellung [H,S,L]
          const mine = h('div', 'layer'), f = h('div', 'field'), sub = h('div', 'actions'), go = h('button', 'btn primary', 'Abschicken');
          sub.append(go); f.append(mine, sub);
          /** Färbt Vorschau und Slider-Hintergründe (Regenbogen, Sättigungs- und Helligkeitsverlauf) neu. */
          const paint = () => {
            mine.style.background = hsl(...cur);
            sH.track.style.background = 'linear-gradient(to top,' + [0, 60, 120, 180, 240, 300, 360].map(x => hsl(x, 100, 50)).join(',') + ')';
            sS.track.style.background = `linear-gradient(to top,${hsl(cur[0], 0, cur[2])},${hsl(cur[0], 100, cur[2])})`;
            sL.track.style.background = `linear-gradient(to top,#000,${hsl(cur[0], cur[1], 50)},#fff)`;
            [sH, sS, sL].forEach(s => s.thumb.style.background = hsl(...cur));   // Griff zeigt die aktuelle Farbe
          };
          const sH = slider('H', 'Farbton', 360, v => { cur[0] = Math.round(v); paint(); });
          const sS = slider('S', 'Sättigung', 100, v => { cur[1] = Math.round(v); paint(); });
          const sL = slider('L', 'Helligkeit', 100, v => { cur[2] = Math.round(v); paint(); });
          const sw = h('div', 'sliders'); sw.append(sH.el, sS.el, sL.el);
          stage.append(sw, f);
          sH.set(cur[0]); sS.set(cur[1]); sL.set(cur[2]); paint();   // erst nach dem Einfügen, damit die Größen bekannt sind
          go.onclick = () => result(cur.slice());
        }

        /** Phase 3: Original (links) und eigene Farbe (rechts) vergleichen, Score hochzählen. */
        function result(mine) {
          stage.replaceChildren();
          const final = colorScore(target, mine);
          const f = h('div', 'field compare'), a = h('div', 'layer'), m = h('div', 'layer mine'), sc = h('div', 'corner num', '0');
          a.style.background = hsl(...target); m.style.background = hsl(...mine); sc.style.color = inkOn(mine);
          const t1 = h('div', 'tag chip', 'Original'), t2 = h('div', 'tag chip', 'Deine Farbe');
          t1.style.left = 'var(--pad)'; t2.style.left = 'calc(50% + var(--pad))';
          const act = h('div', 'actions'); f.append(a, m, t1, t2, sc, act); stage.append(f);
          requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('go')));   // löst die Aufdeck-Animation aus
          const t0 = performance.now(), D = 3000;                // 3 Sekunden hochzählen, Ease-out (kubisch)
          const step = now => {
            const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
            sc.textContent = String(Math.round(final * e));
            if (p < 1) raf = requestAnimationFrame(step); else finish();
          };
          raf = requestAnimationFrame(step);
          /** Nach der Animation: Bestwert speichern, "Neuer Bestwert" und "Nochmal" anzeigen. */
          function finish() {
            const isNew = final > 0 && final > Score.getBest(ID); Score.submitScore(ID, final); refreshBest();
            if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
            const again = h('button', 'btn', 'Nochmal'); again.onclick = round; act.append(again); again.focus({ preventScroll: true });
          }
        }
      }
      round();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 2: Blockfolge (Registry-ID "block-sequence") ----------
   REGELN: Auf einem Raster (Level wählbar: 2x2, 3x3, 4x4, 5x5, 6x6) leuchtet eine Folge von Blöcken nacheinander auf
   (Start: 3 Blöcke). Der Spieler tippt dieselbe Folge nach. Ist sie richtig, kommt ein weiterer Block dazu (die
   bisherige Folge bleibt unverändert). Ein falscher Tipp beendet das Spiel: der falsche Block wird rot, der
   RICHTIGE Block grün. Ein Block erscheint nie direkt zweimal hintereinander; das Tempo steigt mit der Länge.
   WERTUNG: Score = Länge der zuletzt komplett richtig getippten Folge (Fehler in der ersten Runde = 0).
   SPEICHER: pro Level eine Score-ID "block-sequence-<N>" (höher = besser). Die Startseite zeigt den Wert für 4x4.
   AUFBAU: showLevels() -> play() -> start() -> show() (Folge abspielen) -> tap() (Eingabe) -> gameOver(). */
GAMES.push((() => {
  const ID = 'block-sequence', START = 3;                  // START = Länge der ersten Folge
  const LEVELS = [{ n: 2, name: 'Mini' }, { n: 3, name: 'Sehr leicht' }, { n: 4, name: 'Leicht' }, { n: 5, name: 'Mittel' }, { n: 6, name: 'Schwer' }];
  const MAIN = 4;                                          // dieses Level liefert den Bestwert für die Startseite
  const sid = n => ID + '-' + n;                           // Score-ID eines Levels
  let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };

  return {
    id: ID, title: 'Blockfolge', players: 1,
    description: 'Merke dir die aufleuchtenden Blöcke und tippe sie in derselben Reihenfolge nach. Jede Runde kommt einer dazu.',
    getBest: () => Score.getBest(sid(MAIN)), bestLabel: 'Bestwert 4×4',
    init(c, api) {
      let level = null;                                    // gewähltes Level, null = Levelauswahl sichtbar
      const { bar, refreshBest } = gameBar('Blockfolge', () => Score.getBest(sid(level ? level.n : MAIN)), api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      /** Levelauswahl: eine Karte pro Level mit eigenem Bestwert. */
      function showLevels() {
        clear(); level = null; refreshBest();
        stage.className = 'stage'; stage.replaceChildren();
        const g = h('div', 'levels');
        LEVELS.forEach(l => {
          const b = h('button', 'lvl'); b.type = 'button';
          const rec = h('div', 'rec', 'Bestwert'); rec.append(h('span', 'num', String(Score.getBest(sid(l.n)))));
          b.append(h('div', 'size num', l.n + '×' + l.n), h('div', 'name', l.name), rec);
          b.onclick = () => { level = l; refreshBest(); play(); };
          g.append(b);
        });
        stage.append(g);
      }

      /** Das eigentliche Spiel für das gewählte Level. */
      function play() {
        clear(); const N = level.n, ALL = N * N, SID = sid(N);
        stage.className = 'stage seq'; stage.replaceChildren();

        /* Seitenleiste: große Zahl (geschafft), Status, Aktionen */
        const side = h('div', 'side'), big = h('div', 'big num', '0'), lbl = h('div', 'lbl', 'Geschafft');
        const status = h('p', 'status'), actions = h('div', 'actions');
        side.append(big, lbl, status, actions);

        /* Raster aus N*N Buttons; die Grid-Spalten/Zeilen werden per Inline-Style gesetzt */
        const wrap = h('div', 'board-wrap'), board = h('div', 'board locked'), cells = [];
        board.style.gridTemplateColumns = `repeat(${N},1fr)`; board.style.gridTemplateRows = `repeat(${N},1fr)`;
        for (let i = 0; i < ALL; i++) {
          const b = h('button', 'cell'); b.type = 'button'; b.dataset.i = i; b.setAttribute('aria-label', 'Block ' + (i + 1));
          cells.push(b); board.append(b);
        }
        wrap.append(board); stage.append(side, wrap);

        let seq = [], pos = 0, locked = true, done = 0;    // seq = Folge (Blockindizes), pos = nächster erwarteter Tipp, done = geschafft
        const lock = v => { locked = v; board.classList.toggle('locked', v); };   // gesperrt = Eingabe ignorieren
        const flash = (n, cls, ms) => { cells[n].classList.add(cls); later(() => cells[n].classList.remove(cls), ms); };
        const unfocus = () => { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); };
        /** Hängt einen zufälligen Block an die Folge an (nie derselbe wie der letzte). */
        const addBlock = () => { let n; do { n = rnd(0, ALL - 1); } while (seq.length && n === seq[seq.length - 1]); seq.push(n); };

        /** Neue Partie: Folge mit START Blöcken erzeugen und abspielen. */
        function start() {
          clear(); actions.replaceChildren(); cells.forEach(x => x.className = 'cell');
          seq = []; done = 0; big.textContent = '0';
          for (let i = 0; i < START; i++) addBlock();
          show();
        }

        /** Spielt die Folge ab (wird mit der Länge etwas schneller) und gibt danach die Eingabe frei. */
        function show() {
          unfocus(); lock(true); pos = 0; status.textContent = 'Merke dir die Reihenfolge';
          const on = Math.max(260, 560 - seq.length * 14), gap = Math.max(120, 220 - seq.length * 4);   // Leuchtdauer und Pause in ms
          let t = 700;
          seq.forEach(n => { later(() => flash(n, 'lit', on), t); t += on + gap; });
          later(() => { unfocus(); lock(false); status.textContent = 'Du bist dran'; }, t);
        }

        /** Verarbeitet einen Tipp auf Block i. */
        function tap(i) {
          if (locked) return;
          if (i !== seq[pos]) return gameOver(i);
          flash(i, 'lit', 180); pos++;
          if (pos === seq.length) {                        // ganze Folge richtig -> ein Block mehr
            lock(true); done = seq.length; big.textContent = String(done); status.textContent = 'Richtig';
            later(() => { addBlock(); show(); }, 800);
          }
        }

        /** Falscher Tipp: falschen Block rot, den richtigen grün markieren, Bestwert speichern, Buttons zeigen. */
        function gameOver(wrong) {
          lock(true); status.textContent = 'Daneben';
          cells[wrong].classList.add('wrong'); cells[seq[pos]].classList.add('right');
          const isNew = done > 0 && done > Score.getBest(SID); Score.submitScore(SID, done); refreshBest();
          actions.replaceChildren();
          if (isNew) actions.append(h('span', 'note chip', 'Neuer Bestwert'));
          const again = h('button', 'btn primary', 'Nochmal'); again.onclick = start;
          const pick = h('button', 'btn', 'Level wählen'); pick.onclick = showLevels;
          actions.append(again, pick); again.focus({ preventScroll: true });
        }

        /* Eingabe: pointerdown für minimale Verzögerung; mousedown-preventDefault und blur() verhindern, dass der
           Block Fokus bekommt. Die Tastatur (Enter/Leertaste) löst click mit detail === 0 aus. */
        board.addEventListener('mousedown', e => e.preventDefault());
        board.addEventListener('pointerdown', e => { const b = e.target.closest('.cell'); if (b) { tap(+b.dataset.i); b.blur(); } });
        board.addEventListener('click', e => { const b = e.target.closest('.cell'); if (b && e.detail === 0) tap(+b.dataset.i); });
        start();
      }

      showLevels();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 3: Reaktionstest (Registry-ID "reaction", Score-ID "reaction-ms") ----------
   REGELN: 5 Versuche. Die Fläche ist zuerst dunkel ("Warten ..."). Nach einer zufälligen Wartezeit (1,5-4 s)
   leuchtet sie in der Akzentfarbe auf ("Jetzt!"); der Spieler tippt so schnell wie möglich. Wer VOR dem Signal tippt,
   bekommt "Zu früh", der Versuch zählt nicht und wird neu gestartet.
   WERTUNG: Jede Reaktionszeit wird in MILLISEKUNDEN angezeigt (Zahl mit Einheit "ms"). Das Ergebnis der Runde
   ist der DURCHSCHNITT der 5 Zeiten (gerundet). Der Bestwert ist der NIEDRIGSTE Durchschnitt (niedriger = besser).
   SPEICHER: Score-ID "reaction-ms" (Millisekunden). Der alte Schlüssel "reaction" (Punkte) wird ignoriert.
   Solange es keinen Bestwert gibt, zeigt die Oberfläche "–" (Score.has verhindert, dass 0 als Bestzeit gilt).
   ZUSTÄNDE (Klasse am .field und Variable state): idle -> wait -> go -> shown (Ergebnis eines Versuchs) ... -> done;
   early = zu früh getippt. Gemessen wird mit dem Zeitstempel des Eingabeereignisses (e.timeStamp). */
GAMES.push((() => {
  const ID = 'reaction-ms', TRIES = 5; let timers = [];
  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const best = () => Score.has(ID) ? Score.getBest(ID) : null;      // null = noch kein Bestwert
  const fmt = v => v == null ? '–' : v + ' ms';                     // Anzeige des Bestwerts

  return {
    id: 'reaction', title: 'Reaktionstest', players: 1,
    description: 'Warte auf das Signal und tippe so schnell du kannst. Fünf Versuche, gewertet wird der Durchschnitt in Millisekunden.',
    getBest: best, formatBest: fmt, bestLabel: 'Bestwert (Ø)',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Reaktionstest', best, api, fmt);
      const stage = h('div', 'stage'); c.append(bar, stage);

      /* .pad = die tippbare Ebene, .msg = zentrierter Text (nicht klickbar), .tag = Chip "Versuch n von 5" */
      const field = h('div', 'field react idle'), pad = h('div', 'layer pad'), msg = h('div', 'msg');
      const chip = h('div', 'tag chip'), act = h('div', 'actions');
      pad.tabIndex = 0; pad.setAttribute('role', 'button'); pad.setAttribute('aria-label', 'Reaktionsfläche');
      field.append(pad, msg, chip, act); stage.append(field);

      let state = 'idle', n = 0, times = [], tGo = 0, lockUntil = 0;   // n = gewertete Versuche, times = Zeiten in ms, tGo = Signalzeitpunkt

      /**
       * Anzeige setzen. st = Zustand (steuert die Farbe per CSS), main = Haupttext, subs = Array von Nebenzeilen,
       * unit = Einheit hinter einer großen Zahl (z. B. 'ms'); ist unit gesetzt, wird main als Zahl dargestellt.
       */
      function show(st, main, subs, unit) {
        state = st; field.className = 'field react ' + st;
        const m = h('div', 'main' + (unit ? ' num' : ''), main);
        if (unit) m.append(h('small', null, unit));
        msg.replaceChildren(m); (subs || []).forEach(t => msg.append(h('div', 'sub', t)));
        const cur = st === 'shown' ? n : n + 1;                          // nach einem Ergebnis: Nummer des gerade beendeten Versuchs
        chip.textContent = st === 'idle' || st === 'done' ? '' : 'Versuch ' + Math.min(cur, TRIES) + ' von ' + TRIES;
        chip.style.display = chip.textContent ? '' : 'none';
      }
      function reset() { clear(); n = 0; times = []; act.replaceChildren(); }

      /** Wartephase: nach zufälliger Zeit zeigt die Fläche das Signal und merkt sich den Startzeitpunkt. */
      function startWait() {
        show('wait', 'Warten …', ['Tippe erst, wenn es leuchtet']);
        later(() => { tGo = performance.now(); show('go', 'Jetzt!', []); }, rnd(1500, 4000));
      }

      /** Runde beendet: Durchschnitt bilden, Bestwert (niedriger = besser) speichern, Ergebnis zeigen. */
      function finish() {
        const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
        const isNew = Score.submitScore(ID, avg, { lowerIsBetter: true }); refreshBest();
        show('done', String(avg), ['Durchschnitt aus ' + TRIES + ' Versuchen', times.join(' · ') + ' ms'], 'ms');
        if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn', 'Nochmal'); again.onclick = () => { reset(); startWait(); };
        act.append(again); again.focus({ preventScroll: true });
      }

      /** Eingabe (Tippen/Taste). ts = Zeitstempel des Ereignisses. Kurze Sperre verhindert versehentliches Weitertippen. */
      function press(ts) {
        if (ts < lockUntil || state === 'done') return;
        if (state === 'idle') { reset(); startWait(); }
        else if (state === 'wait') {                                      // zu früh
          clear(); lockUntil = ts + 600;
          show('early', 'Zu früh', ['Tippen für einen neuen Anlauf']);
        } else if (state === 'go') {                                      // gültige Reaktion
          const ms = Math.max(0, Math.round(ts - tGo));
          times.push(ms); n++;
          if (n >= TRIES) return finish();
          lockUntil = ts + 500;
          show('shown', String(ms), ['Tippen für den nächsten Versuch'], 'ms');
        } else startWait();                                               // nach "early" oder "shown": nächster Versuch
      }

      pad.addEventListener('pointerdown', e => { press(e.timeStamp); });
      pad.addEventListener('keydown', e => {
        if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(e.timeStamp); }
      });
      show('idle', 'Tippen zum Start', [TRIES + ' Versuche, gewertet wird der Durchschnitt in Millisekunden']);
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 4: Schätzspiel (Registry-ID und Score-ID "estimate") ----------
   REGELN: 5 Runden mit Schätzaufgaben (Winkel, Kreisanteil, Länge; jeder Typ kommt mindestens einmal vor, die
   Reihenfolge ist gemischt). Eingabe über einen vertikalen Slider links; rechts steht die Grafik, oben rechts der
   aktuell eingestellte Wert. "Abschicken" zeigt eine Ergebnisleiste (Dein Tipp, Richtig, Punkte x/100), "Weiter"
   geht zur nächsten Runde, am Ende folgt das Gesamtergebnis (Summe/500 und eine Kachel pro Runde).
   SLIDER-WERTEBEREICH: Die Länge des Sliders bleibt gleich, aber sein Wertebereich [min, max] wird pro Aufgabe
   eng um den richtigen Wert gelegt (makeRange). So kann man genauer einstellen. Damit man nicht schummeln kann,
   liegt der richtige Wert NIE in der Mitte des Bereichs (relative Position 5-38 % oder 62-95 %).
   Breiten: Winkel 75, Kreisanteil 60, Länge 75 % des Sollwerts (mindestens 30); Toleranz/Breite ist überall 0,2.
   WERTUNG pro Runde (0-100): 100 * e^(-(Fehler/Toleranz)^1.5); Toleranz: Winkel 15 (Grad), Kreisanteil 12 (Prozentpunkte),
   Länge 15 % (Fehler relativ zum Sollwert). Score = Summe der 5 Runden (max. 500). Score-ID "estimate" (höher = besser).
   AUFBAU: newGame() -> ask() (eine Runde) -> finish() (Gesamtergebnis). */
GAMES.push((() => {
  const ID = 'estimate', ROUNDS = 5, NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };   // SVG-Element bauen
  const pt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy + r * Math.sin(deg * Math.PI / 180)];   // Punkt auf Kreis
  const f1 = n => n.toFixed(2);

  /**
   * Legt den Slider-Wertebereich der Breite `width` so um `truth`, dass er in [dMin, dMax] bleibt und der Sollwert
   * nicht in der Mitte liegt (relative Position in 5-38 % oder 62-95 %). Gibt { min, max } zurück.
   */
  function makeRange(truth, width, dMin, dMax) {
    for (let W = width; W >= 10; W -= 5) {          // falls kein Platz: Bereich etwas schmaler versuchen
      const a = Math.max(.05, 1 - (dMax - truth) / W), b = Math.min(.95, (truth - dMin) / W);   // erlaubte Position des Sollwerts im Bereich
      const parts = [[a, Math.min(b, .38)], [Math.max(a, .62), b]].filter(p => p[1] - p[0] > .01);   // ohne die Mitte
      if (!parts.length) continue;
      const total = parts.reduce((s, p) => s + p[1] - p[0], 0); let r = Math.random() * total, p = parts[0];
      for (const q of parts) { if (r <= q[1] - q[0]) { p = q; break; } r -= q[1] - q[0]; }          // Teilstück nach Länge gewichtet
      const f = p[0] + Math.random() * (p[1] - p[0]), lo = Math.round(truth - f * W);
      return { min: lo, max: lo + W };
    }
    return { min: dMin, max: dMax };
  }

  /* Aufgabentypen. Jede Funktion liefert { label, prompt, min, max, truth, tol, rel, draw() }:
     label = Kurzname für die Ergebniskachel, prompt = Aufgabentext, min/max = Slider-Bereich, truth = richtiger Wert,
     tol = Toleranz der Wertung, rel = Fehler relativ zum Sollwert (in Prozent) statt absolut, draw() = SVG-Grafik. */
  const TYPES = {
    angle() {                                       // Winkel zwischen zwei Strahlen, 15-165 Grad
      const a = rnd(15, 165), rot = rnd(0, 359), r = makeRange(a, 75, 0, 180);
      return { label: 'Winkel', prompt: 'Winkel schätzen', min: r.min, max: r.max, truth: a, tol: 15, rel: false, draw() {
        const g = el('g', {}), p1 = pt(50, 30, 26, rot), p2 = pt(50, 30, 26, rot + a);
        g.append(el('line', { class: 'ray', x1: 50, y1: 30, x2: f1(p1[0]), y2: f1(p1[1]) }),
                 el('line', { class: 'ray', x1: 50, y1: 30, x2: f1(p2[0]), y2: f1(p2[1]) }),
                 el('circle', { class: 'dot', cx: 50, cy: 30, r: 1.6 }));
        return g;
      } };
    },
    pie() {                                         // gefüllter Kreisausschnitt, 8-92 Prozent der Kreisfläche
      const p = rnd(8, 92), start = rnd(0, 359), r = makeRange(p, 60, 0, 100);
      return { label: 'Kreis', prompt: 'Kreisanteil schätzen', min: r.min, max: r.max, truth: p, tol: 12, rel: false, draw() {
        const g = el('g', {}), a = p * 3.6, s = pt(50, 30, 25, start), e = pt(50, 30, 25, start + a);
        g.append(el('circle', { class: 'pie-bg', cx: 50, cy: 30, r: 25 }),
                 el('path', { class: 'pie', d: `M50 30 L${f1(s[0])} ${f1(s[1])} A25 25 0 ${a > 180 ? 1 : 0} 1 ${f1(e[0])} ${f1(e[1])} Z` }),
                 el('circle', { class: 'rim', cx: 50, cy: 30, r: 25 }));
        return g;
      } };
    },
    length() {                                      // untere Linie im Verhältnis zur oberen (Referenz = 100)
      const L = rnd(8, 88), truth = Math.round(L * 2.5);          // Referenz: 40 Einheiten = 100, also Sollwert = L * 2,5
      const r = makeRange(truth, Math.max(30, Math.round(truth * .75)), 0, 250);
      return { label: 'Länge', prompt: 'Länge schätzen: obere Linie = 100', min: r.min, max: r.max, truth, tol: 15, rel: true, draw() {
        const g = el('g', {}), t = el('text', { class: 'svgtxt', x: 30, y: 12, 'text-anchor': 'middle' });
        t.textContent = '100';
        g.append(t,
          el('line', { class: 'ln ref', x1: 10, y1: 18, x2: 50, y2: 18 }), el('line', { class: 'ln ref', x1: 10, y1: 15.5, x2: 10, y2: 20.5 }), el('line', { class: 'ln ref', x1: 50, y1: 15.5, x2: 50, y2: 20.5 }),
          el('line', { class: 'ln', x1: 10, y1: 42, x2: 10 + L, y2: 42 }), el('line', { class: 'ln', x1: 10, y1: 39.5, x2: 10, y2: 44.5 }), el('line', { class: 'ln', x1: 10 + L, y1: 39.5, x2: 10 + L, y2: 44.5 }));
        return g;
      } };
    }
  };

  /** 5 Aufgaben: jeder Typ mindestens einmal, zwei weitere zufällig, dann mischen (Fisher-Yates). */
  function makeTasks() {
    const keys = Object.keys(TYPES), list = [...keys, keys[Math.floor(Math.random() * 3)], keys[Math.floor(Math.random() * 3)]];
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    return list.map(k => TYPES[k]());
  }

  return {
    id: ID, title: 'Schätzspiel', players: 1,
    description: 'Schätze Winkel, Kreisanteile und Längen nach Augenmaß. Fünf Runden, je genauer, desto mehr Punkte.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Schätzspiel', ID, api);
      const stage = h('div', 'stage'); c.append(bar, stage);
      let tasks = [], round = 0, total = 0, results = [];     // results = [{ p: Punkte, label }] je beendeter Runde

      function newGame() { tasks = makeTasks(); round = 0; total = 0; results = []; ask(); }

      /** Eine Runde: Slider links, Grafik rechts. Nach "Abschicken" wird die Ergebnisleiste eingeblendet. */
      function ask() {
        stage.replaceChildren();
        const t = tasks[round]; let guess = t.min;
        const field = h('div', 'field est'), fig = h('div', 'layer fig'), corner = h('div', 'corner num', String(t.min));
        const prompt = h('div', 'tag top chip', t.prompt), tags = h('div', 'tags'), act = h('div', 'actions');
        const go = h('button', 'btn primary', 'Abschicken');
        const svg = el('svg', { viewBox: '0 0 100 60', 'aria-hidden': 'true' }); svg.append(t.draw()); fig.append(svg);
        tags.append(h('span', 'chip', 'Runde ' + (round + 1) + ' von ' + ROUNDS)); act.append(go);
        field.append(fig, prompt, corner, tags, act);

        /* Slider mit Wertebereich [t.min, t.max]; die Füllung (Akzentfarbe) folgt dem Griff. */
        const sl = slider('Tipp', 'Schätzwert', t.max, v => {
          guess = Math.round(v); corner.textContent = String(guess);
          const T = sl.thumb.offsetHeight || 44;
          sl.track.style.background = `linear-gradient(to top,var(--accent) calc(${T / 2}px + (100% - ${T}px) * ${(v - t.min) / (t.max - t.min)}),var(--bg2) 0)`;
        }, t.min);
        sl.thumb.style.background = 'var(--accent)';
        const sw = h('div', 'sliders'); sw.append(sl.el);
        stage.append(sw, field);
        sl.set(t.min, true);

        /* Auswertung: Fehler -> Punkte, Ergebnisleiste (Dein Tipp / Richtig / Punkte) mit Button "Weiter" bzw. "Ergebnis" */
        go.onclick = () => {
          const err = t.rel ? Math.abs(guess - t.truth) / t.truth * 100 : Math.abs(guess - t.truth);
          const p = Math.round(100 * Math.exp(-Math.pow(err / t.tol, 1.5)));
          total += p; results.push({ p, label: t.label });
          sl.track.style.pointerEvents = 'none'; sl.track.tabIndex = -1;       // Slider sperren
          const stat = (k, v, cls, of) => {
            const s = h('div', 'stat' + (cls ? ' ' + cls : '')), val = h('div', 'v num', String(v));
            if (of) val.append(h('small', null, of));
            s.append(h('div', 'k', k), val); return s;
          };
          const stats = h('div', 'stats'); stats.append(stat('Dein Tipp', guess), stat('Richtig', t.truth), stat('Punkte', p, 'hero', '/100'));
          const next = h('button', 'btn primary', round + 1 < ROUNDS ? 'Weiter' : 'Ergebnis');
          next.onclick = () => { round++; round < ROUNDS ? ask() : finish(); };
          const panel = h('div', 'rpanel'); panel.append(stats, next);
          field.classList.add('res'); tags.remove(); act.remove(); field.append(panel); next.focus({ preventScroll: true });
        };
      }

      /** Gesamtergebnis: Summe/500, darunter pro Runde "erreicht/100" mit Balken. Speichert den Bestwert. */
      function finish() {
        stage.replaceChildren();
        const isNew = total > 0 && total > Score.getBest(ID); Score.submitScore(ID, total); refreshBest();
        const field = h('div', 'field est final'), bg = h('div', 'layer'), box = h('div', 'final-box'), act = h('div', 'actions');
        const tot = h('div', 'total num', String(total)); tot.append(h('small', null, '/' + ROUNDS * 100));
        const tiles = h('div', 'tiles'), fills = [];
        results.forEach((r, i) => {
          const tile = h('div', 'tile'), val = h('div', 'tv num', String(r.p)), meter = h('div', 'meter'), fill = h('i');
          val.append(h('small', null, '/100')); fill.dataset.w = r.p; meter.append(fill); fills.push(fill);
          tile.append(h('div', 'tn', (i + 1) + ' · ' + r.label), val, meter); tiles.append(tile);
        });
        box.append(h('div', 'final-label', 'Gesamtergebnis'), tot, tiles);
        if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn', 'Nochmal'); again.onclick = newGame; act.append(again);
        field.append(bg, box, act); stage.append(field); again.focus({ preventScroll: true });
        requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach(f => { f.style.width = f.dataset.w + '%'; })));   // Balken wachsen lassen
      }

      newGame();
    }
  };
})());

/* ---------- Spiel 5: Stroop-Test (Registry-ID "stroop") ----------
   REGELN: Ein Farbwort (z. B. "Rot") erscheint in einer Schriftfarbe, die meist NICHT zum Wort passt (80 %; in 20 %
   der Fälle passt sie). Der Spieler tippt auf den Button der SCHRIFTFARBE, nicht des Wortes. 30 Sekunden Zeit.
   LEVEL (Levelauswahl wie bei der Blockfolge): 4 Farben (Leicht), 6 Farben (Mittel), 8 Farben (Schwer).
   KEINE DOPPELUNGEN: Der nächste Reiz hat ein ANDERES Wort UND eine ANDERE Schriftfarbe als der vorherige
   (weder das Wort noch die Farbe wiederholt sich direkt hintereinander, siehe nextStim).
   WERTUNG: richtig = +1 Punkt, falsch = -1 Punkt (der Punktestand fällt nie unter 0). Score = Punktestand nach 30 s.
   SPEICHER: pro Level eine Score-ID "stroop-<Farbanzahl>" (höher = besser). Startseite zeigt den Wert für 4 Farben.
   BEDIENUNG: Antippen oder Zifferntasten 1 bis N (N = Farbanzahl). Nach jeder Antwort leuchtet kurz ein Ring
   (Akzentfarbe = richtig, rot = falsch).
   PHASEN (Klasse am .field): idle (Erklärung + Start), play (läuft), done (Ergebnis). AUFBAU: showLevels() -> play() ->
   idle() -> begin() -> answer() ... -> finish(). */
GAMES.push((() => {
  const ID = 'stroop', TIME = 30, MAIN = 4, CONGRUENT = 0.2;      // CONGRUENT = Anteil der Reize, bei denen Wort und Farbe passen
  /* Alle möglichen Farben in fester Reihenfolge; ein Level mit N Farben nutzt die ersten N. c = CSS-Farbe der Schrift. */
  const ALL_COLORS = [
    { name: 'Rot', c: '#ef6a56' }, { name: 'Blau', c: '#5ea8f5' }, { name: 'Gelb', c: '#f5d547' }, { name: 'Grün', c: '#5ccb83' },
    { name: 'Orange', c: '#f59a3a' }, { name: 'Violett', c: '#b790f2' }, { name: 'Rosa', c: '#f58ac0' }, { name: 'Türkis', c: '#3fd0d0' }
  ];
  const LEVELS = [{ n: 4, name: 'Leicht' }, { n: 6, name: 'Mittel' }, { n: 8, name: 'Schwer' }];
  const sid = n => ID + '-' + n;                                  // Score-ID eines Levels
  let timers = [], iv = 0, onKey = null;
  /** Stoppt Timeouts, das Zeitintervall und den Tastatur-Listener. */
  const clear = () => {
    timers.forEach(clearTimeout); timers = []; clearInterval(iv);
    if (onKey) { document.removeEventListener('keydown', onKey); onKey = null; }
  };

  return {
    id: ID, title: 'Stroop-Test', players: 1,
    description: 'Tippe auf die Farbe der Schrift, nicht auf das Wort. Dreißig Sekunden, mit 4, 6 oder 8 Farben.',
    getBest: () => Score.getBest(sid(MAIN)), bestLabel: 'Bestwert 4 Farben',
    init(c, api) {
      let level = null;                                           // gewähltes Level, null = Levelauswahl sichtbar
      const { bar, refreshBest } = gameBar('Stroop-Test', () => Score.getBest(sid(level ? level.n : MAIN)), api);
      const stage = h('div', 'stage'); c.append(bar, stage);

      /** Levelauswahl: eine Karte pro Level (Farbanzahl groß, Name, eigener Bestwert). */
      function showLevels() {
        clear(); level = null; refreshBest();
        stage.className = 'stage'; stage.replaceChildren();
        const g = h('div', 'levels');
        LEVELS.forEach(l => {
          const b = h('button', 'lvl'); b.type = 'button';
          const size = h('div', 'size num', String(l.n)); size.append(h('small', null, 'Farben'));
          const rec = h('div', 'rec', 'Bestwert'); rec.append(h('span', 'num', String(Score.getBest(sid(l.n)))));
          b.append(size, h('div', 'name', l.name), rec);
          b.onclick = () => { level = l; refreshBest(); play(); };
          g.append(b);
        });
        stage.append(g);
      }

      /** Spiel für das gewählte Level aufbauen (Layout hängt von der Farbanzahl ab). */
      function play() {
        clear();
        const N = level.n, COLORS = ALL_COLORS.slice(0, N), SID = sid(N);
        const cols = N === 6 ? 3 : 4, rows = Math.ceil(N / cols);   // 4 Farben: 1x4, 6 Farben: 2x3, 8 Farben: 2x4 Buttons
        const sizeCls = ' r' + rows + (N > 4 ? ' big' : '');        // CSS-Klassen für Zeilenzahl und kleinere Schrift
        stage.className = 'stage'; stage.replaceChildren();

        /* .stim = das große Farbwort, .opts = Antwortbuttons, .corner = Restzeit, .tag = Punktestand, .msg = Texte */
        const field = h('div', 'field stroop idle' + sizeCls), bg = h('div', 'layer'), msg = h('div', 'msg'), stim = h('div', 'stim');
        const corner = h('div', 'corner num', String(TIME)), chip = h('div', 'tag chip'), opts = h('div', 'opts'), act = h('div', 'actions');
        opts.style.setProperty('--cols', cols);
        field.append(bg, msg, stim, corner, chip, opts, act); stage.append(field);

        let phase = 'idle', score = 0, right = 0, wrong = 0, end = 0, cur = null;   // cur = aktueller Reiz { word, ink } (Farbindizes)
        COLORS.forEach((col, i) => {
          const b = h('button', 'btn', col.name); b.type = 'button'; b.setAttribute('aria-label', col.name + ' (Taste ' + (i + 1) + ')');
          b.onclick = () => answer(i); opts.append(b);
        });
        const view = ph => { phase = ph; field.className = 'field stroop ' + ph + sizeCls; };   // Phase wechseln (setzt auch ok/bad zurück)

        /** Erklärungsbildschirm mit "Start" und "Level wählen". */
        function idle() {
          clear(); view('idle'); act.replaceChildren();
          msg.replaceChildren(h('div', 'main', 'Stroop-Test'), h('div', 'sub', 'Tippe auf die Farbe der Schrift, nicht auf das Wort. ' + N + ' Farben, ' + TIME + ' Sekunden: richtig gibt einen Punkt, falsch kostet einen.'));
          const go = h('button', 'btn primary', 'Start'); go.onclick = begin;
          const pick = h('button', 'btn', 'Level wählen'); pick.onclick = showLevels;
          act.append(go, pick); go.focus({ preventScroll: true });
        }

        /**
         * Wählt den nächsten Reiz. Wort UND Schriftfarbe müssen sich vom vorherigen Reiz unterscheiden
         * (keine Doppelungen). In 80 % der Fälle passt die Farbe NICHT zum Wort, sonst (CONGRUENT) schon.
         */
        function nextStim() {
          let w, i;
          do {
            w = Math.floor(Math.random() * N);
            i = Math.random() < CONGRUENT ? w : (w + 1 + Math.floor(Math.random() * (N - 1))) % N;   // (w + 1..N-1) mod N ist nie w
          } while (cur && (w === cur.word || i === cur.ink));
          cur = { word: w, ink: i }; stim.textContent = COLORS[w].name; stim.style.color = COLORS[i].c;
        }

        /** Startet die 30 Sekunden: Zähler zurücksetzen, ersten Reiz zeigen, Timer und Zifferntasten aktivieren. */
        function begin() {
          clear(); score = 0; right = 0; wrong = 0; cur = null; act.replaceChildren(); view('play');
          end = performance.now() + TIME * 1000; corner.textContent = String(TIME); chip.textContent = 'Punkte 0'; nextStim();
          onKey = e => { if (/^[1-9]$/.test(e.key) && !e.repeat && +e.key <= N) answer(+e.key - 1); };
          document.addEventListener('keydown', onKey);
          iv = setInterval(() => {                                   // Restzeit anzeigen, bei 0 beenden
            corner.textContent = String(Math.max(0, Math.ceil((end - performance.now()) / 1000)));
            if (performance.now() >= end) finish();
          }, 100);
        }

        /** Antwort i (Farbindex) auswerten: +1 bei richtig, -1 bei falsch (mindestens 0), Ring aufleuchten lassen, nächster Reiz. */
        function answer(i) {
          if (phase !== 'play') return;
          const ok = i === cur.ink;
          if (ok) { score++; right++; } else { score = Math.max(0, score - 1); wrong++; }
          field.classList.add(ok ? 'ok' : 'bad'); timers.push(setTimeout(() => field.classList.remove('ok', 'bad'), 220));
          chip.textContent = 'Punkte ' + score; nextStim();
        }

        /** Zeit abgelaufen: Bestwert speichern, Endstand zeigen. */
        function finish() {
          clear(); view('done');
          const isNew = score > 0 && score > Score.getBest(SID); Score.submitScore(SID, score); refreshBest();
          msg.replaceChildren(h('div', 'main', 'Zeit um'), h('div', 'sub', 'Richtig ' + right + ' · Falsch ' + wrong));
          corner.textContent = String(score); chip.textContent = 'Endstand';
          act.replaceChildren(); if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
          const again = h('button', 'btn', 'Nochmal'); again.onclick = begin;
          const pick = h('button', 'btn', 'Level wählen'); pick.onclick = showLevels;
          act.append(again, pick); again.focus({ preventScroll: true });
        }

        idle();
      }

      showLevels();
    },
    destroy() { clear(); }
  };
})());

/* ---------- Spiel 6: Mastermind (Registry-ID und Score-ID "mastermind") ----------
   REGELN: Das Spiel wählt einen geheimen Code aus 4 Plätzen. Jeder Platz hat eine von 6 Farben; EINE FARBE DARF
   MEHRFACH VORKOMMEN. Der Spieler hat höchstens 10 Versuche. Er wählt Farben aus der Palette; sie füllen von links nach
   rechts die AKTUELLE ZEILE DES BRETTS (es gibt keine separaten Eingabefelder, man schaut nur auf die Kette).
   "Löschen" entfernt den letzten Stein (ein Stein der aktuellen Zeile lässt sich auch direkt antippen).
   "Prüfen" (nur bei 4 gefüllten Plätzen aktiv) bewertet den Versuch; rechts neben der Zeile erscheinen Rückmelde-Punkte:
     VOLLER PUNKT = richtige Farbe am richtigen Platz, RING = richtige Farbe am falschen Platz (jede Farbe wird nur
     so oft gezählt, wie sie im Code vorkommt). Die Position der Punkte sagt NICHTS über die Plätze aus.
   Ganz oben auf dem Brett steht die Code-Zeile: verdeckt ("?") während des Spiels, am Ende aufgedeckt.
   WERTUNG: geknackt nach n Versuchen: Score = 110 - 10 * n (1 Versuch = 100 ... 10 Versuche = 10); nicht geknackt = 0.
   SPEICHER: Score-ID "mastermind" (höher = besser). AUFBAU: newGame() -> place()/removeLast()/clearSlot() -> submit() -> end(). */
GAMES.push((() => {
  const ID = 'mastermind', LEN = 4, MAXTRY = 10;
  const COLORS = [{ name: 'Rot', c: '#ef6a56' }, { name: 'Gelb', c: '#f5d547' }, { name: 'Grün', c: '#5ccb83' },
                  { name: 'Blau', c: '#5ea8f5' }, { name: 'Violett', c: '#b790f2' }, { name: 'Weiß', c: '#f3eee4' }];

  /**
   * Vergleicht Versuch und Code (Arrays aus Farbindizes). exact = richtige Farbe am richtigen Platz,
   * color = richtige Farbe am falschen Platz. Doppelte Farben werden korrekt gezählt (jedes Code-Element nur einmal).
   */
  function feedback(secret, guess) {
    let exact = 0, color = 0; const s = [], g = [];
    for (let i = 0; i < LEN; i++) { if (secret[i] === guess[i]) exact++; else { s.push(secret[i]); g.push(guess[i]); } }
    for (const x of g) { const k = s.indexOf(x); if (k > -1) { color++; s.splice(k, 1); } }
    return { exact, color };
  }

  return {
    id: ID, title: 'Mastermind', players: 1,
    description: 'Knacke den geheimen Farbcode aus vier Farben in höchstens zehn Versuchen. Je weniger Versuche, desto mehr Punkte.',
    init(c, api) {
      const { bar, refreshBest } = gameBar('Mastermind', ID, api);
      const stage = h('div', 'stage mm'); c.append(bar, stage);
      const board = h('div', 'mboard'), side = h('div', 'mside');
      const status = h('p', 'mstatus'), pal = h('div', 'palette'), act = h('div', 'macts');

      /* Legende (bewusst auffällig): Beispiel-Punkte mit Erklärung plus Hinweis auf mehrfache Farben */
      const legend = h('div', 'legend');
      const lrow = (cls, text) => { const r = h('div', 'lrow'); r.append(h('span', 'mpin ' + cls), h('span', null, text)); return r; };
      legend.append(lrow('x', 'Voller Punkt: Farbe und Platz richtig'), lrow('c', 'Ring: Farbe richtig, Platz falsch'),
                    h('div', 'lnote', 'Eine Farbe darf mehrfach vorkommen.'));
      side.append(status, pal, act, legend); stage.append(board, side);

      /* Code-Zeile ganz oben: 4 verdeckte Steine ("?") und ein unsichtbarer Pin-Platzhalter für gleiche Breite */
      const solRow = h('div', 'mrow sol'), solPegs = h('div', 'mpegs'), ghost = h('div', 'mpins ghost'), solPg = [];
      solRow.setAttribute('aria-label', 'Geheimer Code');
      for (let i = 0; i < LEN; i++) { const p = h('span', 'mp q', '?'); solPegs.append(p); solPg.push(p); ghost.append(h('span', 'mpin')); }
      solRow.append(solPegs, ghost); board.append(solRow);

      /* Verlaufszeilen: MAXTRY Zeilen mit je LEN Steinen (pg) und LEN Rückmelde-Punkten (pn) */
      const rows = [];
      for (let r = 0; r < MAXTRY; r++) {
        const row = h('div', 'mrow'), pegs = h('div', 'mpegs'), pins = h('div', 'mpins'), pg = [], pn = [];
        for (let i = 0; i < LEN; i++) {
          const p = h('span', 'mp'), q = h('span', 'mpin');
          p.onclick = () => { if (phase === 'play' && r === attempt) clearSlot(i); };   // nur Steine der aktuellen Zeile
          pegs.append(p); pins.append(q); pg.push(p); pn.push(q);
        }
        row.append(pegs, pins); board.append(row); rows.push({ el: row, pg, pn });
      }

      /* Farbpalette: ein runder Button pro Farbe */
      COLORS.forEach((col, i) => {
        const b = h('button', 'sw'); b.type = 'button'; b.style.background = col.c; b.setAttribute('aria-label', col.name); b.onclick = () => place(i); pal.append(b);
      });
      const check = h('button', 'btn primary', 'Prüfen'), undo = h('button', 'btn ghost', 'Löschen');
      check.onclick = submit; undo.onclick = removeLast;

      let secret = [], guess = [], attempt = 0, phase = 'play';   // secret/guess = Farbindizes (guess: -1 = leer), attempt = aktuelle Zeile (0-9)

      /** Färbt einen Stein (idx = Farbindex, -1 = leer). */
      function paint(el, idx) { el.style.background = idx >= 0 ? COLORS[idx].c : ''; el.classList.toggle('f', idx >= 0); }

      /** Zeichnet die aktuelle Zeile, Markierung, "Prüfen"-Status und Statustext neu. */
      function render() {
        if (rows[attempt]) rows[attempt].pg.forEach((p, i) => { paint(p, guess[i]); p.setAttribute('aria-label', 'Platz ' + (i + 1) + ': ' + (guess[i] >= 0 ? COLORS[guess[i]].name : 'leer')); });
        rows.forEach((r, i) => r.el.classList.toggle('cur', phase === 'play' && i === attempt));
        check.disabled = guess.includes(-1);
        if (phase === 'play') status.textContent = 'Versuch ' + (attempt + 1) + ' von ' + MAXTRY;
      }

      function place(ci) { if (phase !== 'play') return; const k = guess.indexOf(-1); if (k > -1) { guess[k] = ci; render(); } }   // Farbe auf den ersten freien Platz
      function clearSlot(i) { if (phase !== 'play') return; guess[i] = -1; render(); }
      function removeLast() { if (phase !== 'play') return; for (let i = LEN - 1; i >= 0; i--) if (guess[i] >= 0) { guess[i] = -1; break; } render(); }

      /** Versuch bewerten: Rückmelde-Punkte setzen (volle zuerst, dann Ringe); bei 4 richtigen ist das Spiel gewonnen. */
      function submit() {
        if (phase !== 'play' || guess.includes(-1)) return;
        const fb = feedback(secret, guess), r = rows[attempt];
        for (let i = 0; i < fb.exact; i++) r.pn[i].classList.add('x');
        for (let i = fb.exact; i < fb.exact + fb.color; i++) r.pn[i].classList.add('c');
        if (fb.exact === LEN) return end(true);
        attempt++;
        if (attempt >= MAXTRY) return end(false);
        guess = Array(LEN).fill(-1); render();
      }

      /** Spielende: Code aufdecken, Score berechnen und speichern, "Nochmal" anbieten. */
      function end(win) {
        phase = 'over'; side.classList.add('over');
        const n = win ? attempt + 1 : MAXTRY, score = win ? 110 - 10 * n : 0;
        const isNew = score > 0 && score > Score.getBest(ID); Score.submitScore(ID, score); refreshBest();
        solPg.forEach((p, i) => { p.textContent = ''; p.classList.remove('q'); paint(p, secret[i]); p.setAttribute('aria-label', 'Code, Platz ' + (i + 1) + ': ' + COLORS[secret[i]].name); });
        status.replaceChildren(win ? 'Geknackt in ' + n + ' Versuchen' : 'Nicht geknackt', h('br'), 'Punkte ' + score + (win ? '' : ' · Der Code steht oben'));
        rows.forEach(r => r.el.classList.remove('cur'));
        act.replaceChildren(); if (isNew) act.append(h('span', 'note chip', 'Neuer Bestwert'));
        const again = h('button', 'btn primary', 'Nochmal'); again.onclick = newGame; act.append(again); again.focus({ preventScroll: true });
      }

      /** Neue Partie: zufälligen Code wählen (Wiederholungen erlaubt), Brett leeren. */
      function newGame() {
        secret = Array.from({ length: LEN }, () => Math.floor(Math.random() * COLORS.length));
        guess = Array(LEN).fill(-1); attempt = 0; phase = 'play'; side.classList.remove('over');
        solPg.forEach(p => { p.textContent = '?'; p.className = 'mp q'; p.style.background = ''; });
        rows.forEach(r => { r.pg.forEach(p => { p.style.background = ''; p.classList.remove('f'); }); r.pn.forEach(q => { q.className = 'mpin'; }); });
        act.replaceChildren(check, undo); render();
      }

      newGame();
    }
  };
})());

/* =====================================================================================
   E) ROUTER - Startseite, Hash-Routing, Fehleranzeige
   -------------------------------------------------------------------------------------
   Der URL-Hash bestimmt die Seite: "#stroop" öffnet das Spiel mit id "stroop", leer = Startseite.
   Der Wechsel geschieht ohne Neuladen (hashchange-Ereignis). Beim Verlassen wird destroy() des Spiels aufgerufen.
   ===================================================================================== */
const app = document.getElementById('app'); let active = null;      // active = aktuell geöffnetes Spielobjekt
const api = { Score, h, back: () => { location.hash = ''; } };     // wird jedem Spiel in init(container, api) übergeben

/** Baut die Startseite: Titel und eine Karte pro Spiel (Titel, Beschreibung, Bestwert). */
function home() {
  const v = h('main', 'view home');
  v.append(h('h1', null, 'Spielstube'), h('p', 'lead', 'Kleine Spiele für zwischendurch. Wähle eines aus und versuche, deinen Bestwert zu schlagen.'));
  const g = h('div', 'grid');
  GAMES.forEach(game => {
    const a = h('a', 'card'); a.href = '#' + game.id;
    const l = h('div'); l.append(h('h2', null, game.title), h('p', null, game.description));
    const best = game.getBest ? game.getBest() : Score.getBest(game.id);          // Spiele können eigene Bestwerte liefern
    const m = h('div', 'meta', game.bestLabel || 'Bestwert'); m.append(h('span', 'num', game.formatBest ? game.formatBest(best) : String(best)));
    a.append(l, m); g.append(a);
  });
  v.append(g); return v;
}

/** Zeigt einen Fehler sichtbar an, statt einen leeren Bildschirm zu hinterlassen. */
function showError(e) {
  app.replaceChildren();
  const v = h('main', 'view home');
  v.append(h('h1', null, 'Fehler'), h('p', 'lead', String((e && e.message) || e)));
  const b = h('button', 'btn', 'Zur Übersicht'); b.onclick = () => { location.hash = ''; location.reload(); };
  v.append(b); app.append(v);
}

/** Zeigt je nach URL-Hash Startseite oder Spiel. Räumt vorher das zuvor aktive Spiel auf. */
function route() {
  try {
    if (active && active.destroy) active.destroy(); active = null;
    const id = location.hash.replace(/^#\/?/, ''), game = GAMES.find(x => x.id === id);
    app.replaceChildren();
    if (game) {
      const v = h('main', 'view'); app.append(v); active = game; game.init(v, api);
    } else app.append(home());
  } catch (e) { showError(e); }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
